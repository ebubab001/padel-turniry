<title>Padla Tour</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1638E8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: one-column phone app on an electric-blue court; white cards float over court lines; bottom tab bar. Single deliberate theme. */
:root{
  --court:#1638E8; --court-deep:#0C24B0; --ball:#DFFF2F; --ink:#0A1240; --paper:#FFFFFF;
  --mist:#EEF1FF; --mute:#6A72A6; --coral:#FF5B4D; --mint:#14B86E; --gold:#FFC93C; --silver:#C9D0E6; --bronze:#F0A36B;
  --warnbg:#FFF4D6; --warnfg:#7A4B00; --tt:#FF8A2B;
  --lineW:rgba(255,255,255,.16);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Manrope",-apple-system,"SF Pro Text",system-ui,sans-serif;
  --r-card:26px; --r-pill:999px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--court);color:var(--paper);font-family:var(--f-body);font-size:16px;line-height:1.45;font-weight:600;-webkit-font-smoothing:antialiased}
.lines{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.lines i{position:absolute;background:var(--lineW)}
.lines .v{left:50%;top:-10%;width:3px;height:120%;transform:translateX(-50%)}
.lines .h1{left:-10%;right:-10%;top:32%;height:3px}
.lines .h2{left:-10%;right:-10%;top:68%;height:3px}
.lines .net{left:-10%;right:-10%;top:50%;height:6px;background:rgba(255,255,255,.08)}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding-inline:16px;padding-block:18px 130px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
input{font:inherit}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--ball)}
.big{font-family:var(--f-display);font-weight:800;font-size:36px;line-height:1.05;letter-spacing:-.02em;text-wrap:balance;margin:6px 0 4px;overflow-wrap:anywhere}
.sub{color:rgba(255,255,255,.78);font-size:15px;font-weight:600}
.card{background:var(--paper);color:var(--ink);border-radius:var(--r-card);padding:18px;box-shadow:0 14px 34px rgba(5,14,90,.28)}
.stack{display:flex;flex-direction:column;gap:14px}
.label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--mute);margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:var(--r-pill);background:var(--mist);color:var(--ink);font-weight:700;font-size:15px}
.chip.on{background:var(--ink);color:var(--ball)}
.chip.off{opacity:.45}
.chip .x{width:20px;height:20px;border-radius:50%;background:rgba(10,18,64,.12);display:grid;place-items:center;font-size:13px;line-height:1}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--mist);border-radius:16px;padding:4px;gap:4px}
.seg.three{grid-template-columns:1fr 1fr 1fr}
.seg button{padding:11px 6px;border-radius:12px;font-weight:800;font-size:14px;color:var(--mute);line-height:1.2}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 3px 10px rgba(10,18,64,.12)}
.seg button.soon{opacity:.45;cursor:default}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row+.row{border-top:1.5px solid var(--mist);margin-top:12px;padding-top:12px}
.stepper{display:flex;align-items:center;gap:6px;flex:none}
.stepper button{width:44px;height:44px;border-radius:14px;background:var(--mist);color:var(--ink);font-size:24px;font-weight:700;display:grid;place-items:center}
.stepper button:active{transform:scale(.92)}
.stepper .val{min-width:52px;text-align:center;font-family:var(--f-display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.fixed{font-family:var(--f-display);font-weight:800;font-size:22px;background:var(--mist);padding:8px 14px;border-radius:14px;flex:none}
.textin{width:100%;height:52px;border-radius:16px;border:2px solid var(--mist);padding:0 14px;color:var(--ink);background:var(--paper);font-weight:700;font-size:17px}
.textin:focus{border-color:var(--court);outline:none}
.addbox{display:flex;gap:8px;margin-top:12px}
.addbox .textin{flex:1;min-width:0;height:50px;font-size:16px}
.addbox button{width:50px;height:50px;border-radius:16px;background:var(--court);color:#fff;font-size:26px;font-weight:700;flex:none}
.err{color:var(--coral);font-size:14px;font-weight:700;margin-top:8px}
.err:empty{display:none}
.cta{width:100%;min-height:60px;border-radius:var(--r-pill);background:var(--ball);color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.01em;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 26px rgba(223,255,47,.35);padding:0 18px}
.cta:active{transform:scale(.98)}
.ghost{width:100%;min-height:52px;border-radius:var(--r-pill);background:rgba(255,255,255,.14);color:#fff;font-weight:800;font-size:15px}
.hint{font-size:14px;color:var(--mute);font-weight:600;margin-top:10px}
.info{background:var(--mist);color:var(--ink);padding:12px 14px;border-radius:16px;margin-top:14px;font-size:14px;font-weight:600}
.info b{font-weight:800}
.warn{background:var(--warnbg);color:var(--warnfg);padding:14px;border-radius:16px;margin-top:14px;font-size:14px;font-weight:600}
.warn b{font-weight:800}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.iconbtn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;color:#fff;flex:none}
.progress{height:8px;border-radius:8px;background:rgba(255,255,255,.18);overflow:hidden;margin:14px 0 4px}
.progress b{display:block;height:100%;background:var(--ball);border-radius:8px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.rest{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;color:rgba(255,255,255,.85)}
.rest span.p{background:rgba(255,255,255,.16);padding:5px 11px;border-radius:var(--r-pill);font-weight:700}
.court{padding:0;overflow:hidden}
.court-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 0}
.court-tag{font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.06em;background:var(--ink);color:var(--ball);padding:7px 12px;border-radius:10px}
.done-tag{font-size:13px;font-weight:800;color:var(--mint);display:flex;gap:6px;align-items:center}
.team{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px}
.names{display:flex;flex-direction:column;gap:2px;min-width:0}
.names .n{font-size:17px;font-weight:800;line-height:1.25;display:flex;align-items:center;gap:7px;flex-wrap:wrap;overflow-wrap:anywhere}
.serve{display:inline-flex;align-items:center;gap:5px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--ink);background:var(--ball);padding:3px 8px 3px 4px;border-radius:var(--r-pill);flex:none}
.ballico{width:14px;height:14px;border-radius:50%;background:#C6EA00;box-shadow:inset 0 0 0 2px #fff;display:inline-block}
.vs{display:flex;align-items:center;gap:10px;padding:0 18px;color:var(--mute);font-size:12px;font-weight:800;letter-spacing:.14em}
.vs::before,.vs::after{content:"";flex:1;height:1.5px;background:var(--mist)}
.score{display:flex;align-items:center;gap:4px;flex:none}
.score button{width:40px;height:44px;border-radius:12px;background:var(--mist);color:var(--ink);font-size:22px;font-weight:700}
.score button:active{transform:scale(.9)}
.score input{width:58px;height:52px;border-radius:14px;border:2px solid var(--mist);text-align:center;font-family:var(--f-display);font-weight:800;font-size:24px;color:var(--ink);background:var(--paper);font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.score input::-webkit-outer-spin-button,.score input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.score input:focus{border-color:var(--court);outline:none}
.final{font-family:var(--f-display);font-weight:800;font-size:34px;font-variant-numeric:tabular-nums;min-width:56px;text-align:right}
.final.win{color:var(--court)}
.final.lose{color:var(--silver)}
.court-foot{padding:4px 18px 18px}
.finish{width:100%;height:54px;border-radius:var(--r-pill);background:var(--ink);color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.finish:active{transform:scale(.98)}
.textbtn{color:var(--court);font-weight:800;font-size:15px;padding:8px 0}
.court.isdone{background:#F6F8FF}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.tabbar nav{display:flex;gap:4px;background:rgba(10,18,64,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:6px;border-radius:var(--r-pill);box-shadow:0 12px 30px rgba(5,10,60,.4)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 18px;border-radius:var(--r-pill);color:rgba(255,255,255,.7);font-size:12px;font-weight:800}
.tabbar button.on{background:var(--ball);color:var(--ink)}
.tabbar svg{width:22px;height:22px}
.lb-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0}
.lb-row+.lb-row{border-top:1.5px solid var(--mist)}
.place{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:14px;background:var(--mist);color:var(--ink)}
.place.p1{background:var(--gold)} .place.p2{background:var(--silver)} .place.p3{background:var(--bronze)}
.place.tie{font-size:11px}
.lb-name{font-weight:800;font-size:16px;overflow-wrap:anywhere}
.lb-meta{font-size:13px;color:var(--mute);font-weight:600;font-variant-numeric:tabular-nums}
.delta{font-family:var(--f-display);font-weight:800;font-size:18px;padding:7px 12px;border-radius:12px;font-variant-numeric:tabular-nums;min-width:62px;text-align:center}
.delta.pos{background:#DDF7EA;color:#0B7A47} .delta.neg{background:#FFE5E2;color:#C2281B} .delta.zero{background:var(--mist);color:var(--mute)}
.round-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.round-title b{font-family:var(--f-display);font-size:16px}
.pill-now{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:var(--ball);color:var(--ink);padding:4px 9px;border-radius:var(--r-pill)}
.mline{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;font-size:14px;font-weight:700;width:100%;text-align:left;color:var(--ink)}
.mline+.mline{border-top:1.5px solid var(--mist)}
.mline .r{text-align:right}
.mline .sc{font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums;background:var(--mist);padding:4px 10px;border-radius:10px;font-size:14px;white-space:nowrap}
.mline .sc.pending{color:var(--mute);font-family:var(--f-body)}
button.mline .sc{background:#E3E8FF}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:end;margin-top:8px}
.pod{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.pod .nm{font-weight:800;font-size:15px;overflow-wrap:anywhere;line-height:1.2}
.pod .blk{width:100%;border-radius:18px 18px 6px 6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:12px;font-family:var(--f-display);font-weight:800;color:var(--ink)}
.pod .blk span{font-size:28px}
.pod .blk small{font-family:var(--f-body);font-size:13px;font-weight:800;opacity:.75}
.champ{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1.05;color:var(--ball);overflow-wrap:anywhere;margin:6px 0}
.tlist{display:flex;flex-direction:column}
.titem{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;width:100%;text-align:left;color:var(--ink)}
.titem+.titem{border-top:1.5px solid var(--mist)}
.ticon{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:13px}
.ticon.am{background:var(--court);color:var(--ball)} .ticon.mx{background:var(--coral);color:#fff} .ticon.pa{background:var(--ink);color:var(--ball)} .ticon.pm{background:var(--ink);color:var(--coral)}
.pairchip{background:var(--mist);color:var(--ink);border-radius:14px;padding:8px 8px 8px 12px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;width:100%}
.pairchip .num{font-family:var(--f-display);font-size:12px;color:var(--mute);flex:none}
.pairchip .pn{flex:1;min-width:0;overflow-wrap:anywhere}
.pairchip.half{border:2px dashed var(--silver);background:var(--paper)}
.fmtcmp{margin-top:12px;font-size:14px}
.fmtcmp summary{cursor:pointer;color:var(--court);font-weight:800;list-style:none}
.fmtcmp summary::-webkit-details-marker{display:none}
.fmtcmp .fr{padding:10px 0;border-top:1.5px solid var(--mist)}
.fmtcmp .fr b{font-weight:800}
.fmtcmp .fr div{color:var(--mute);font-weight:600}
.tname{font-weight:800;font-size:16px;overflow-wrap:anywhere;line-height:1.25}
.tmeta{font-size:13px;color:var(--mute);font-weight:600}
.chev{color:var(--mute);font-size:22px}
.sync{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:rgba(255,255,255,.85);background:rgba(255,255,255,.12);padding:6px 12px;border-radius:var(--r-pill)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--silver);display:inline-block}
.sync.cloud i{background:#7DF5C0} .sync.syncing i{background:var(--ball)} .sync.offline i{background:var(--coral)}
.empty{text-align:center;padding:10px 4px;color:var(--mute);font-size:15px}
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(5,10,50,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet{width:100%;max-width:520px;background:var(--paper);color:var(--ink);border-radius:28px 28px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.9,.2,1);max-height:90vh;overflow:auto}
.grab{width:40px;height:5px;border-radius:5px;background:var(--silver);margin:0 auto 14px}
.sheet h3{font-family:var(--f-display);font-size:20px;margin:0 0 6px}
.sheet p{color:var(--mute);margin:0 0 16px;font-weight:600}
.sheet .act{width:100%;min-height:54px;border-radius:16px;background:var(--mist);font-weight:800;font-size:16px;margin-top:8px;color:var(--ink)}
.sheet .act.danger{background:var(--coral);color:#fff}
.sheet .act.primary{background:var(--ink);color:var(--ball)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--ball);font-weight:800;padding:12px 18px;border-radius:var(--r-pill);box-shadow:0 10px 26px rgba(0,0,0,.3);animation:fade .2s ease;max-width:calc(100% - 32px);text-align:center}
.sportcard{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--paper);color:var(--ink);border-radius:var(--r-card);padding:16px 18px;text-align:left;box-shadow:0 14px 34px rgba(5,14,90,.28);width:100%}
.sportcard b{display:block;font-family:var(--f-display);font-size:19px;font-weight:800}
.sportcard span span,.sportcard>span>span{display:block;color:var(--mute);font-size:14px;font-weight:600}
.sic{width:64px;height:64px;border-radius:20px;display:grid;place-items:center}
.sic.pad{background:var(--court);color:var(--ball)} .sic.tt{background:var(--court);color:var(--ball)}
.ticon.tt{background:var(--court);color:var(--ball)}
.eyebrow.tt{color:var(--tt)} .champ.tt{color:var(--tt)}
.cta.tt{background:var(--tt);color:var(--ink);box-shadow:0 10px 26px rgba(255,138,43,.35)}
.court-tag.tt{color:var(--tt)}
.fmtopt{display:block;width:100%;text-align:left;background:var(--mist);color:var(--ink);border-radius:16px;padding:12px 14px;border:2px solid transparent}
.fmtopt b{display:block;font-weight:800;font-size:16px} .fmtopt small{color:var(--mute);font-weight:600;font-size:13px}
.fmtopt em{font-style:normal;font-size:11px;background:var(--tt);color:var(--ink);padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:2px}
.fmtopt.on{border-color:var(--ink);background:var(--paper)} .fmtopt.dim{opacity:.45}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--mist);color:var(--ink);border-radius:16px;padding:12px 14px}
.toggle b{display:block;font-weight:800;font-size:15px} .toggle small{display:block;color:var(--mute);font-weight:600;font-size:13px}
.toggle i{flex:none;width:46px;height:28px;border-radius:999px;background:var(--silver);position:relative;transition:background .2s}
.toggle i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle.on i{background:var(--mint)} .toggle.on i::after{transform:translateX(18px)}
.seedno{font-family:var(--f-display);font-size:11px;color:var(--mute)}
.btnrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center}
.finish.alt{background:var(--mist);color:var(--ink)}
.iconbtn.sm{width:44px;height:44px;background:var(--mist);color:var(--ink)}
.gamegrid{display:grid;grid-template-columns:28px 1fr 1fr;gap:8px;align-items:center;margin-bottom:10px}
.gamegrid b{font-size:14px;font-weight:800;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gno{font-family:var(--f-display);font-size:13px;color:var(--mute);text-align:center}
.gin{width:100%;height:50px;border-radius:14px;border:2px solid var(--mist);text-align:center;font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--ink);background:var(--paper);-moz-appearance:textfield}
.gin::-webkit-outer-spin-button,.gin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.gin:focus{border-color:var(--court);outline:none} .gin.bad{border-color:var(--coral);background:#FFF1EF}
.matchsum{font-size:15px;color:var(--ink);font-weight:600;margin:4px 0}
.livewrap{display:grid;gap:12px;margin-top:14px}
.livehalf{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:34vh;border-radius:28px;background:var(--paper);color:var(--ink);padding:16px;box-shadow:0 14px 34px rgba(5,14,90,.28)}
.livehalf:active{transform:scale(.985)}
.livehalf.serving{outline:4px solid var(--tt)}
.lname{font-weight:800;font-size:18px;text-align:center;overflow-wrap:anywhere}
.lpts{font-family:var(--f-display);font-weight:800;font-size:96px;line-height:1;font-variant-numeric:tabular-nums}
.lgames{color:var(--mute);font-weight:700;font-size:14px} .lgames b{color:var(--ink)}
.lserve{display:inline-flex;align-items:center;gap:6px;background:var(--tt);color:var(--ink);font-size:13px;font-weight:800;padding:5px 12px 5px 6px;border-radius:999px}
.ballico.tt{background:#FFB36B}
.mline .wn{font-weight:800} .qual{background:#DDF7EA;color:#0B7A47;font-size:11px;padding:2px 7px;border-radius:999px}
.rulesbadge{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-body);font-size:12px;font-weight:800;letter-spacing:.04em;background:var(--ball);color:var(--ink);padding:4px 10px;border-radius:999px;vertical-align:2px}
.rulesbadge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--court)}
.rulesbadge.sm{font-size:11px;padding:2px 8px}
.fmtopt .rulesbadge{background:var(--court);color:var(--ball)} .fmtopt .rulesbadge::before{background:var(--ball)}
input,textarea{caret-color:var(--court)}
.setgrid-head{display:grid;grid-template-columns:44px 1fr 1fr;gap:8px;margin-bottom:6px}
.setgrid-head b{font-size:14px;font-weight:800;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setrow{display:grid;grid-template-columns:44px 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px}
.setrow .gno{font-size:12px}

/* ================= storage: phone first, cloud copy when available ================= */
function freshDraft(){return {name:'',format:'americano',players:SAMPLE.slice(),sample:true,limit:24,mode:'sum',courts:2,rounds:null,scheme:'13',cycles:1}}
function freshStore(){return {tournaments:{},draft:freshDraft(),ttdraft:freshTTDraft(),ui:{screen:'home',id:null,tab:'play'},unsynced:[]}}
let store;
function loadLocal(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
function migrateOld(){
  let o=null;try{o=JSON.parse(localStorage.getItem(OLD_KEY))}catch(e){}
  if(!o||!o.sched||!o.players)return;
  const id=newId();
  store.tournaments[id]={id,name:'Американо · перенесённый',format:'americano',players:o.players,rounds:o.sched,round:o.round||0,
    cfg:{limit:o.cfg.limit,mode:o.cfg.mode,courts:o.cfg.courts,plan:'equal',total:o.sched.length},
    stage:o.phase==='done'?'results':'play',status:'active',createdAt:Date.now(),updatedAt:Date.now()};
  store.unsynced.push(id);
  try{localStorage.removeItem(OLD_KEY)}catch(e){}
}

const DB={ref:null,backend:null,status:'local'};
const TG=(window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.initData)?window.Telegram.WebApp:null;
const pend=new Set(),writing=new Set();let syncTimer=null;
function setStatus(s){if(DB.status===s)return;DB.status=s;const el=$('#sync');if(el)el.outerHTML=syncChip()}
function syncChip(){
  const m={cloud:DB.backend==='tg'?'Сохранено в облаке Telegram':'Сохранено в облаке',syncing:'Сохраняется…',offline:'Нет связи — данные на телефоне, отправим позже',local:'Сохраняется на этом телефоне',full:'Облако заполнено — удалите старые турниры'};
  return `<span class="sync ${DB.status}" id="sync"><i></i>${m[DB.status]||m.local}</span>`;
}
function touch(T){T.updatedAt=Date.now();saveLocal();queueSync(T.id)}
function queueSync(id){pend.add(id);store.unsynced=[...pend];saveLocal();clearTimeout(syncTimer);syncTimer=setTimeout(flush,600)}
async function flush(){
  if(!DB.backend||!pend.size)return;
  setStatus('syncing');
  for(const id of [...pend]){
    if(writing.has(id))continue;
    const T=store.tournaments[id];if(!T){pend.delete(id);continue}
    const at=T.updatedAt;writing.add(id);
    try{
      await saveRemote(T);
      if((store.tournaments[id]||{}).updatedAt===at)pend.delete(id);
    }catch(e){setStatus(e&&e.code==='quota_exceeded'?'full':'offline');writing.delete(id);store.unsynced=[...pend];saveLocal();return}
    writing.delete(id);
  }
  store.unsynced=[...pend];saveLocal();
  if(pend.size){clearTimeout(syncTimer);syncTimer=setTimeout(flush,600)}else setStatus('cloud');
}
function saveRemote(T){return DB.backend==='tg'?tgSave(T):DB.ref.collection('tournaments').doc(T.id).set(clone(T))}
setInterval(()=>{if(pend.size&&DB.backend)flush()},15000);
addEventListener('online',()=>flush());
let deferredRender=false;
function safeRender(){const a=document.activeElement;if(a&&a.tagName==='INPUT'&&$('#app').contains(a)){deferredRender=true;return}render()}
document.addEventListener('focusout',()=>{if(deferredRender){deferredRender=false;setTimeout(()=>{const a=document.activeElement;if(!(a&&a.tagName==='INPUT'))render()},50)}});

/* Telegram cloud storage: values are limited to ~4 KB, so each tournament is split into chunks plus an index key */
const tgIndex={},CHUNK=3000;
function tgCall(fn,...args){return new Promise((res,rej)=>{try{TG.CloudStorage[fn](...args,(e,v)=>e?rej({code:'unavailable',message:String(e)}):res(v))}catch(e){rej({code:'unavailable'})}})}
async function tgSave(T){
  const id=T.id,old=(tgIndex[id]||{}).n||0;
  if(T.deleted){
    if(old)await tgCall('removeItems',[...Array(old).keys()].map(i=>`t_${id}_${i}`));
    await tgCall('setItem',`t_${id}_n`,JSON.stringify({n:0,u:T.updatedAt,deleted:1}));
    tgIndex[id]={n:0,u:T.updatedAt,deleted:1};return;
  }
  const s=JSON.stringify(T),parts=[];for(let i=0;i<s.length;i+=CHUNK)parts.push(s.slice(i,i+CHUNK));
  for(let i=0;i<parts.length;i++)await tgCall('setItem',`t_${id}_${i}`,parts[i]);
  await tgCall('setItem',`t_${id}_n`,JSON.stringify({n:parts.length,u:T.updatedAt}));
  if(old>parts.length)await tgCall('removeItems',[...Array(old-parts.length).keys()].map(i=>`t_${id}_${parts.length+i}`));
  tgIndex[id]={n:parts.length,u:T.updatedAt};
}
async function tgLoad(){
  const keys=await tgCall('getKeys');
  const idx=(keys||[]).filter(k=>/^t_[A-Za-z0-9]+_n$/.test(k));
  let changed=false;
  if(idx.length){
    const vals=await tgCall('getItems',idx);
    for(const k of idx){
      const id=k.slice(2,-2);let meta;try{meta=JSON.parse(vals[k])}catch(e){continue}
      tgIndex[id]=meta;const L=store.tournaments[id];
      if(L&&(L.updatedAt||0)>=meta.u)continue;
      if(meta.deleted){if(L){L.deleted=true;L.updatedAt=meta.u;changed=true}continue}
      const ck=[...Array(meta.n).keys()].map(i=>`t_${id}_${i}`);
      try{const parts=await tgCall('getItems',ck);store.tournaments[id]=JSON.parse(ck.map(c=>parts[c]).join(''));changed=true}catch(e){}
    }
  }
  Object.keys(store.tournaments).forEach(id=>{const m=tgIndex[id],L=store.tournaments[id];if(!m||m.u<(L.updatedAt||0))pend.add(id)});
  if(changed){saveLocal();safeRender()}
}
function tgSetup(){
  try{
    TG.ready();TG.expand();
    if(TG.setHeaderColor)TG.setHeaderColor('#1638E8');
    if(TG.setBackgroundColor)TG.setBackgroundColor('#1638E8');
    if(TG.isVersionAtLeast&&TG.isVersionAtLeast('7.7')&&TG.disableVerticalSwipes)TG.disableVerticalSwipes();
  }catch(e){}
}
function tgClosingGuard(){try{if(!TG)return;const on=store.ui.screen==='play';if(on)TG.enableClosingConfirmation();else TG.disableClosingConfirmation()}catch(e){}}

async function connectCloud(){
  try{
    if(TG){
      if(!(TG.isVersionAtLeast&&TG.isVersionAtLeast('6.9')&&TG.CloudStorage))return;
      DB.backend='tg';setStatus('syncing');
      try{await tgLoad();setStatus(pend.size?'syncing':'cloud')}catch(e){setStatus('offline')}
      if(pend.size)flush();
      return;
    }
    if(!window.claude||!window.claude.use)return;
    const db=await window.claude.use('db');
    if(!db)return;
    DB.ref=db;DB.backend='claude';setStatus(pend.size?'syncing':'cloud');
    db.collection('tournaments').onSnapshot(snap=>{
      let changed=false;const ids=new Set();
      snap.docs.forEach(d=>{ids.add(d.id);const x=d.data();if(!x)return;const L=store.tournaments[d.id];
        if(!L||(x.updatedAt||0)>(L.updatedAt||0)){store.tournaments[d.id]=clone(x);changed=true}});
      if(!snap.metadata.fromCache)Object.keys(store.tournaments).forEach(id=>{if(!ids.has(id))pend.add(id)});
      if(changed){saveLocal();safeRender()}
      if(pend.size)flush();else if(!snap.metadata.fromCache)setStatus('cloud');
    },()=>setStatus('offline'));
  }catch(e){}
}

/* ================= schedules ================= */
function circleRounds(n){
  const m=n%2?n+1:n,ids=shuffle([...Array(n).keys()]);if(m>n)ids.push(-1);
  const R=[];
  for(let r=0;r<m-1;r++){
    const teams=[],pair=(x,y)=>{const a=ids[x],b=ids[y];if(a>=0&&b>=0)teams.push([a,b])};
    pair(m-1,r);
    for(let i=1;i<m/2;i++)pair((r+i)%(m-1),(r-i+m-1)%(m-1));
    R.push(teams);
  }
  return R;
}
function assignServers(rounds,n){
  const serves=Array(n).fill(0);
  rounds.forEach(R=>R.matches.forEach(m=>{
    const four=shuffle(m.t1.concat(m.t2)).sort((p,q)=>serves[p]-serves[q]);
    m.server=four[0];serves[four[0]]++;
    if(!m.t1.includes(m.server)){const t=m.t1;m.t1=m.t2;m.t2=t}
    if(m.t1[1]===m.server)m.t1.reverse();
    m.s1='';m.s2='';m.done=false;
  }));
  return rounds;
}
function withSit(matchList,n){return {matches:matchList.map(m=>({t1:m.t1.slice(),t2:m.t2.slice()})),sit:[...Array(n).keys()].filter(p=>!matchList.some(m=>m.t1.includes(p)||m.t2.includes(p)))}}
/* Americano, n = 4k or 4k+1: every pair of players partners exactly once */
function buildAmericanoFull(n,courts){
  const O=zeros(n),byRound=[];
  circleRounds(n).forEach((teams,ri)=>{
    let best=null,bc=1e9;
    for(let t=0;t<300;t++){
      const s=shuffle(teams);let c=0;const ms=[];
      for(let k=0;k+1<s.length;k+=2){const A=s[k],B=s[k+1];c+=O[A[0]][B[0]]+O[A[0]][B[1]]+O[A[1]][B[0]]+O[A[1]][B[1]];ms.push({t1:A,t2:B,r:ri})}
      if(c<bc){bc=c;best=ms;if(c===0)break}
    }
    best.forEach(m=>m.t1.forEach(a=>m.t2.forEach(b=>{O[a][b]++;O[b][a]++})));
    byRound.push(best);
  });
  return assignServers(packSlots(byRound,courts,n).map(s=>withSit(s,n)),n);
}
/* Fit a fixed schedule onto the available courts; when there are fewer courts than matches in a round, players wait */
function packSlots(byRound,courts,n){
  const perRound=byRound[0].length;
  let slots;
  if(courts>=perRound)slots=byRound;
  else{
    const games=Array(n).fill(0),left=byRound.flat();slots=[];
    while(left.length){
      const order=left.map((m,i)=>({m,i,k:m.t1.concat(m.t2).reduce((a,p)=>a+games[p],0)})).sort((a,b)=>a.m.r-b.m.r||a.k-b.k||a.i-b.i);
      const used=new Set(),pick=[];
      for(const o of order){if(pick.length>=courts)break;const ps=o.m.t1.concat(o.m.t2);if(ps.some(p=>used.has(p)))continue;ps.forEach(p=>used.add(p));pick.push(o.m)}
      pick.forEach(m=>{left.splice(left.indexOf(m),1);m.t1.concat(m.t2).forEach(p=>games[p]++)});
      slots.push(pick);
    }
  }
  return slots;
}
/* Team Americano (round robin): fixed pairs, every pair meets every other pair exactly once */
function buildTeamRR(pairs,n,courts,cycles){
  const byRound=[];
  for(let c=0;c<(cycles||1);c++)circleRounds(pairs.length).forEach(games=>{const r=byRound.length;byRound.push(games.map(([x,y])=>({t1:pairs[x].slice(),t2:pairs[y].slice(),r})))});
  return assignServers(packSlots(byRound,courts,n).map(s=>withSit(s,n)),n);
}
const pairsOf=players=>{const out=[];for(let i=0;i+1<players.length;i+=2)out.push([i,i+1]);return out};
/* Equal games, partners as varied as possible (used when "everyone with everyone" is impossible) */
function buildEqualGames(n,courts,rounds){
  const P=zeros(n),O=zeros(n),rest=Array(n).fill(0),lastRest=Array(n).fill(-1),out=[],act=activeCount(n,courts);
  for(let r=0;r<rounds;r++){
    const order=shuffle([...Array(n).keys()]).sort((a,b)=>rest[a]-rest[b]||lastRest[a]-lastRest[b]);
    const sit=order.slice(0,n-act),play=order.slice(n-act);
    sit.forEach(i=>{rest[i]++;lastRest[i]=r});
    let best=null,bc=1e9;
    for(let t=0;t<800;t++){
      const s=shuffle(play);let c=0;const ms=[];
      for(let k=0;k<s.length;k+=4){const [a,b,x,y]=s.slice(k,k+4);c+=(P[a][b]+P[x][y])*100+(O[a][x]+O[a][y]+O[b][x]+O[b][y])*5;ms.push({t1:[a,b],t2:[x,y]})}
      if(c<bc){bc=c;best=ms;if(c===0)break}
    }
    best.forEach(m=>{const [a,b]=m.t1,[x,y]=m.t2;P[a][b]++;P[b][a]++;P[x][y]++;P[y][x]++;[[a,x],[a,y],[b,x],[b,y]].forEach(([p,q])=>{O[p][q]++;O[q][p]++})});
    out.push(withSit(best,n));
  }
  return assignServers(out,n);
}
/* Mexicano: round 1 random, then by current standings in blocks of four */
/* Team Mexicano: fixed pairs; round 1 random, then pairs with close standings meet (avoiding an immediate rematch when possible) */
function teamMexRound(T){
  const n=T.players.length,pairs=T.pairs,P=pairs.length,prev=T.rounds;
  const playN=2*Math.min(T.cfg.courts,Math.floor(P/2));
  const rest=Array(P).fill(0),lastRest=Array(P).fill(-1),serves=Array(n).fill(0),lastOpp=Array(P).fill(-1);
  const pairOf={};pairs.forEach(([a,b],k)=>{pairOf[a]=k;pairOf[b]=k});
  prev.forEach((R,ri)=>{pairs.forEach(([a],k)=>{if(R.sit.includes(a)){rest[k]++;lastRest[k]=ri}});R.matches.forEach(m=>serves[m.server]++)});
  if(prev.length)prev[prev.length-1].matches.forEach(m=>{const x=pairOf[m.t1[0]],y=pairOf[m.t2[0]];lastOpp[x]=y;lastOpp[y]=x});
  const order=shuffle([...Array(P).keys()]).sort((a,b)=>rest[a]-rest[b]||lastRest[a]-lastRest[b]);
  const sitP=order.slice(0,P-playN),playing=new Set(order.slice(P-playN));
  const ranked=prev.length?standings(T).st.map(s=>s.i).filter(k=>playing.has(k)):shuffle([...playing]);
  for(let k=0;k+3<ranked.length;k+=2)if(lastOpp[ranked[k]]===ranked[k+1]){const t=ranked[k+1];ranked[k+1]=ranked[k+2];ranked[k+2]=t}
  if(ranked.length>=4){const k=ranked.length-2;if(lastOpp[ranked[k]]===ranked[k+1]){const t=ranked[k];ranked[k]=ranked[k-1];ranked[k-1]=t}}
  const matches=[];
  for(let k=0;k+1<ranked.length;k+=2){
    const m={t1:pairs[ranked[k]].slice(),t2:pairs[ranked[k+1]].slice()};
    const four=shuffle(m.t1.concat(m.t2)).sort((p,q)=>serves[p]-serves[q]);
    m.server=four[0];serves[four[0]]++;
    if(!m.t1.includes(m.server)){const t=m.t1;m.t1=m.t2;m.t2=t}
    if(m.t1[1]===m.server)m.t1.reverse();
    m.s1='';m.s2='';m.done=false;matches.push(m);
  }
  const sit=[];sitP.forEach(k=>sit.push(...pairs[k]));
  return {matches,sit};
}
function mexicanoRound(T){
  if(T.format==='teammex')return teamMexRound(T);
  const n=T.players.length,act=activeCount(n,T.cfg.courts),prev=T.rounds;
  const rest=Array(n).fill(0),lastRest=Array(n).fill(-1),serves=Array(n).fill(0);
  prev.forEach((R,ri)=>{R.sit.forEach(p=>{rest[p]++;lastRest[p]=ri});R.matches.forEach(m=>serves[m.server]++)});
  const order=shuffle([...Array(n).keys()]).sort((a,b)=>rest[a]-rest[b]||lastRest[a]-lastRest[b]);
  const sit=order.slice(0,n-act),playing=new Set(order.slice(n-act));
  const ranked=prev.length?stats(T).st.map(s=>s.i).filter(p=>playing.has(p)):shuffle([...playing]);
  const matches=[];
  for(let k=0;k<ranked.length;k+=4){
    const [a,b,c,d]=ranked.slice(k,k+4);
    const m=T.cfg.scheme==='14'?{t1:[a,d],t2:[b,c]}:{t1:[a,c],t2:[b,d]};
    const four=shuffle([a,b,c,d]).sort((p,q)=>serves[p]-serves[q]);
    m.server=four[0];serves[four[0]]++;
    if(!m.t1.includes(m.server)){const t=m.t1;m.t1=m.t2;m.t2=t}
    if(m.t1[1]===m.server)m.t1.reverse();
    m.s1='';m.s2='';m.done=false;matches.push(m);
  }
  return {matches,sit};
}

/* ================= standings: places strictly by Δ ================= */
function stats(T){
  const st=T.players.map((name,i)=>({i,name,g:0,w:0,f:0,a:0}));
  T.rounds.forEach(r=>r.matches.forEach(m=>{if(!m.done)return;const s1=+m.s1,s2=+m.s2;
    m.t1.forEach(p=>{const o=st[p];o.g++;o.f+=s1;o.a+=s2;if(s1>s2)o.w++});
    m.t2.forEach(p=>{const o=st[p];o.g++;o.f+=s2;o.a+=s1;if(s2>s1)o.w++});
  }));
  st.forEach(s=>s.d=s.f-s.a);
  st.sort((x,y)=>y.d-x.d||y.f-x.f||x.name.localeCompare(y.name));
  let ties=false;
  st.forEach(s=>{const f=st.findIndex(o=>o.d===s.d);let l=f;while(l+1<st.length&&st[l+1].d===s.d)l++;
    s.p1=f+1;s.place=f===l?String(f+1):(f+1)+'–'+(l+1);s.tie=f!==l;if(s.tie&&s.g)ties=true});
  const gs=new Set(st.map(s=>s.g));
  return {st,ties,unequal:gs.size>1};
}
/* What the leaderboard shows: players, or pairs in Team Americano (both partners always have identical numbers) */
function standings(T){
  const base=stats(T);
  if(!PAIRF(T.format))return base;
  const by={};base.st.forEach(s=>by[s.i]=s);
  const st=(T.pairs||pairsOf(T.players)).map(([a,b],k)=>{const s=by[a];return {i:k,name:T.players[a]+' и '+T.players[b],g:s.g,w:s.w,f:s.f,a:s.a,d:s.d}});
  st.sort((x,y)=>y.d-x.d||y.f-x.f||x.name.localeCompare(y.name));
  let ties=false;
  st.forEach(s=>{const f=st.findIndex(o=>o.d===s.d);let l=f;while(l+1<st.length&&st[l+1].d===s.d)l++;
    s.p1=f+1;s.place=f===l?String(f+1):(f+1)+'–'+(l+1);s.tie=f!==l;if(s.tie&&s.g)ties=true});
  return {st,ties,unequal:new Set(st.map(s=>s.g)).size>1};
}
function validScore(T,a,b){
  const L=T.cfg.limit;
  if(a===''||b===''||a==null||b==null)return 'Введите счёт обеих пар';
  a=Number(a);b=Number(b);
  if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||b<0)return 'Счёт — целые числа от 0';
  if(T.cfg.mode==='sum'&&a+b!==L)return `Сумма должна быть ${L}, сейчас ${a+b}`;
  if(T.cfg.mode==='race'&&!((a===L&&b<L)||(b===L&&a<L)))return `Одна пара набирает ровно ${L}, другая меньше`;
  return null;
}

/* ================= tournament plan from setup ================= */
let preview={key:'',rounds:null};
function restStep(n,c){const s=n-activeCount(n,c);return s?n/gcd(n,s):1}
function maxCourts(d){const n=d.players.length;return Math.max(1,PAIRF(d.format)?Math.floor(Math.floor(n/2)/2):Math.floor(n/4))}
/* The coach's chosen courts stay as set; what is used is capped by what the current players can fill */
function effCourts(d){return Math.max(1,Math.min(d.courts||1,maxCourts(d)))}
function planFor(d){
  const n=d.players.length,c=effCourts(d);
  if(n<4)return {ok:false};
  if(PAIRF(d.format)&&n%2)return {ok:false,odd:true};
  if(d.format==='team'){
    const P=n/2,cy=d.cycles||1,key='team#'+d.players.join('\u0001')+'#'+c+'#'+cy;
    if(preview.key!==key)preview={key,rounds:buildTeamRR(pairsOf(d.players),n,c,cy)};
    return {ok:true,plan:'team',total:preview.rounds.length,games:(P-1)*cy,cycles:cy,pairsN:P,perRound:Math.floor(P/2),packed:c<Math.floor(P/2)};
  }
  if(d.format==='teammex'){
    const P=n/2,actP=2*Math.min(c,Math.floor(P/2)),sP=P-actP,stepP=sP?P/gcd(P,sP):1;
    const defP=stepP===1?5:Math.ceil(5/stepP)*stepP,R=(d.rounds&&d.rounds%stepP===0)?d.rounds:defP;
    return {ok:true,plan:'mex',total:R,games:R*actP/P,act:actP*2,step:stepP,def:defP,pairsN:P,restPairs:sP};
  }
  const act=activeCount(n,c),step=restStep(n,c);
  const pick=def=>(d.rounds&&d.rounds%step===0)?d.rounds:def;
  if(d.format==='americano'){
    if(n%4<2){
      const key='am#'+d.players.join('\u0001')+'#'+c;
      if(preview.key!==key)preview={key,rounds:buildAmericanoFull(n,c)};
      const perRound=Math.floor(n/4);
      return {ok:true,plan:'full',total:preview.rounds.length,games:n-1,act,usedCourts:Math.min(c,perRound),perRound,packed:c<perRound};
    }
    const def=Math.ceil((n-1)/step)*step,R=pick(def);
    return {ok:true,plan:'equal',total:R,games:R*act/n,act,step,def};
  }
  const def=step===1?6:Math.ceil(5/step)*step,R=pick(def);
  return {ok:true,plan:'mex',total:R,games:R*act/n,act,step,def};
}
function nearFull(n){let lo=n,hi=n;while(lo%4>1)lo--;while(hi%4>1)hi++;return {lo,hi}}

function defaultName(d){return `${FMT[d.format]} · ${dateRu(Date.now())}`}

function addNames(text){
  const d=curDraft();if(d.sample){d.players=[];d.sample=false}
  const list=text.split(isPairInput(d)?/[\n,;+\/]+/:/[\n,;]+/).map(s=>s.trim()).filter(Boolean);
  if(!list.length){$('#e-names').textContent='Введите имя';return}
  const skipped=[];
  list.forEach(n=>{if(d.players.some(p=>p.toLowerCase()===n.toLowerCase()))skipped.push(n);else d.players.push(n.slice(0,40))});
  saveLocal();render();$('#newname').focus();
  if(skipped.length)$('#e-names').textContent=`Уже есть: ${skipped.join(', ')}`;
}

function startTournament(){
  const d=store.draft,n=d.players.length;
  if(n<4){$('#e-names').textContent='Нужно минимум 4 игрока';$('#e-names').scrollIntoView({block:'center',behavior:'smooth'});return}
  if(n>40){$('#e-names').textContent='Максимум 40 игроков';return}
  if(PAIRF(d.format)&&n%2){$('#e-names').textContent='Нужно чётное число игроков — у одного нет пары';$('#e-names').scrollIntoView({block:'center',behavior:'smooth'});return}
  const P=planFor(d),id=newId();
  const T={id,name:(d.name.trim()||defaultName(d)).slice(0,60),format:d.format,players:d.players.slice(),pairs:PAIRF(d.format)?pairsOf(d.players):undefined,
    cfg:{limit:d.limit,mode:d.mode,courts:effCourts(d),scheme:d.scheme||'13',plan:P.plan,total:P.total},
    rounds:[],round:0,stage:'play',status:'active',createdAt:Date.now(),updatedAt:Date.now()};
  if(P.plan==='full'||P.plan==='team')T.rounds=clone(preview.rounds);

  else if(P.plan==='equal')T.rounds=buildEqualGames(n,effCourts(d),P.total);
  else T.rounds=[mexicanoRound(T)];
  T.cfg.total=P.plan==='mex'?P.total:T.rounds.length;
  store.tournaments[id]=T;preview={key:'',rounds:null};
  store.draft={...freshDraft(),players:d.players.slice(),sample:false,format:d.format,limit:d.limit,mode:d.mode,courts:d.courts,scheme:d.scheme,cycles:d.cycles||1};
  touch(T);go('play',id,'play');wake();
}

function rrect(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()}
function fitText(x,t,max){if(x.measureText(t).width<=max)return t;while(t.length>1&&x.measureText(t+'…').width>max)t=t.slice(0,-1);return t+'…'}
function wrapLines(x,t,max,maxLines){
  const words=String(t).split(/\s+/),lines=[];let line='';
  words.forEach(w=>{const tryL=line?line+' '+w:w;if(x.measureText(tryL).width<=max||!line)line=tryL;else{lines.push(line);line=w}});
  if(line)lines.push(line);
  if(lines.length>maxLines){const keep=lines.slice(0,maxLines);keep[maxLines-1]=fitText(x,keep[maxLines-1]+' '+lines.slice(maxLines).join(' '),max);return keep}
  return lines.map(l=>fitText(x,l,max));
}
function padelCardData(T){

  return {sport:'ПАДЕЛ',meta:`${FMT[T.format]} · ${dateRu(T.finishedAt||T.createdAt)} · до ${T.cfg.limit}`,champLabel:pairsF||champs.length>1?'ЧЕМПИОНЫ':'ЧЕМПИОН',
    champ:champs.map(s=>s.name).join(pairsF?', ':' и '),champSub:`Δ ${fmtD(st[0].d)} · ${st[0].f}:${st[0].a}`,head:[pairsF?'ПАРА':'ИГРОК','Δ'],
    rows:st.map(s=>({name:s.name,place:s.place,p1:s.p1,tie:s.tie,mid:`${s.f}:${s.a}`,pill:fmtD(s.d),kind:s.d>0?'pos':s.d<0?'neg':'zero',sub:'Δ '+fmtD(s.d)})),foot:'Места — по Δ (забито − пропущено)'};
}

/* ================= padel classic (FIP rules): engine (no DOM) ================= */
/* match settings: deuce 'adv' | 'golden' | 'star'; fmt 'bo3' | 'one' | 'short'; dec 'set' | 'stb' (super tie-break to 10 instead of the deciding set) */
const PC_DEUCE={adv:'Больше-меньше',golden:'Золотое очко',star:'Стар-пойнт'};
const PC_FMT={bo3:'2 из 3 сетов',one:'1 сет',short:'2 из 3 коротких сетов (до 4)'};
const pcSetLen=c=>c.fmt==='short'?4:6;
const pcNeed=c=>c.fmt==='one'?1:2;
const pcMinutes=c=>c.fmt==='one'?35:c.fmt==='short'?(c.dec==='stb'?40:50):(c.dec==='stb'?70:85);
/* one set: {a,b} games, plus {ta,tb} tie-break points when it went to a tie-break; super tie-break: {a,b,stb:true} points */
function pcSetErr(s,c,isDecider){
  const num=v=>v!==''&&v!=null&&Number.isInteger(+v)&&+v>=0;
  if(isDecider&&c.dec==='stb'&&c.fmt!=='one'){
    if(!num(s.a)||!num(s.b))return 'Введите счёт супер-тай-брейка';
    const w=Math.max(+s.a,+s.b),l=Math.min(+s.a,+s.b);
    if(w===l)return 'В тай-брейке не бывает ничьей';
    if(w<10)return 'Супер-тай-брейк идёт до 10 очков';
    if(l<=8&&w!==10)return `При ${l} у проигравших победители набирают ровно 10`;
    if(l>=9&&w!==l+2)return `После 9:9 нужен отрыв в 2 очка — например ${l+2}:${l}`;
    return null;
  }
  if(!num(s.a)||!num(s.b))return 'Введите счёт сета (геймы)';
  const S=pcSetLen(c),a=+s.a,b=+s.b,w=Math.max(a,b),l=Math.min(a,b);
  if(a===b)return 'В сете не бывает ничьей';
  if(w<S)return `Сет идёт до ${S} геймов`;
  if(w===S&&l<=S-2)return null;
  if(w===S+1&&l===S-1)return null;
  if(w===S+1&&l===S){
    if(!num(s.ta)||!num(s.tb))return `При ${S+1}:${S} введите счёт тай-брейка`;
    const ta=+s.ta,tb=+s.tb,tw=Math.max(ta,tb),tl=Math.min(ta,tb);
    if((ta>tb)!==(a>b))return 'Тай-брейк должен выиграть тот, кто выиграл сет';
    if(tw<7)return 'Тай-брейк идёт до 7 очков';
    if(tl<=5&&tw!==7)return `При ${tl} у проигравших в тай-брейке победители набирают ровно 7`;
    if(tl>=6&&tw!==tl+2)return `В тай-брейке после 6:6 нужен отрыв в 2 очка`;
    return null;
  }
  if(w===S&&l===S-1)return `При ${S}:${S-1} сет не окончен — нужно ${S+1}:${S-1} или тай-брейк при ${S}:${S}`;
  return `Счёт ${a}:${b} невозможен: сет заканчивается при ${S}:${S-2} и меньше, ${S+1}:${S-1} или ${S+1}:${S} с тай-брейком`;
}
function pcMatchCheck(sets,c){
  const need=pcNeed(c);
  if(!sets.length)return {err:'Введите счёт хотя бы одного сета'};
  let wa=0,wb=0;
  for(let i=0;i<sets.length;i++){
    if(wa===need||wb===need)return {err:`Матч уже закончился после ${i}-го сета — лишний сет`};
    const dec=(i===2*need-2)&&need>1;
    const e=pcSetErr(sets[i],c,dec);if(e)return {err:`${dec&&c.dec==='stb'?'Супер-тай-брейк':`Сет ${i+1}`}: ${e}`};
    if(+sets[i].a>+sets[i].b)wa++;else wb++;
  }
  if(wa<need&&wb<need)return {err:`Матч идёт до ${need} ${plural(need,'выигранного сета','выигранных сетов','выигранных сетов')} — сейчас ${wa}:${wb}`};
  return {win:wa>wb?'a':'b',wa,wb};
}
const pcSetText=s=>s.stb?`[${s.a}:${s.b}]`:`${s.a}:${s.b}${s.ta!=null&&s.ta!==''?`(${Math.min(+s.ta,+s.tb)})`:''}`;

/* ---------- live scoring ---------- */
/* L: {sets:[...], g:[a,b] games in current set, p:[a,b] points in current game, deuces:n, order:[4 player ids], first:0, hist:[]} */
const PC_PT=['0','15','30','40'];
function pcLiveState(T,m,L){
  const c=T.cfg,need=pcNeed(c),S=pcSetLen(c);
  const wa=L.sets.filter(s=>+s.a>+s.b).length,wb=L.sets.length-wa;
  const done=wa>=need||wb>=need;
  const deciderSTB=!done&&need>1&&L.sets.length===2*need-2&&c.dec==='stb';
  const tieBreak=!done&&!deciderSTB&&L.g[0]===S&&L.g[1]===S;
  return {need,S,wa,wb,done,stb:deciderSTB,tb:tieBreak||deciderSTB,tbTo:deciderSTB?10:7};
}
function pcPointLabel(T,m,L){
  const st=pcLiveState(T,m,L),[a,b]=L.p;
  if(st.tb)return [String(a),String(b)];
  if(a>=3&&b>=3){
    if(a===b)return ['40','40'];
    return a>b?['AD','40']:['40','AD'];
  }
  return [PC_PT[Math.min(a,3)],PC_PT[Math.min(b,3)]];
}
/* is the next point at 40:40 decisive? (golden point, or the 3rd deuce under star point) */
function pcDecisive(T,L){const c=T.cfg,[a,b]=L.p;if(!(a>=3&&b>=3&&a===b))return false;return c.deuce==='golden'||(c.deuce==='star'&&L.deuces>=3)}
/* serve: order of 4 players across games [team A first server, team B first server, A partner, B partner] */
function pcServeInfo(T,m,L){
  const st=pcLiveState(T,m,L),gamesPlayed=L.sets.reduce((x,s)=>x+(s.stb?1:(+s.a)+(+s.b)),0)+L.g[0]+L.g[1];
  const o=L.order;
  if(!st.tb)return {server:o[gamesPlayed%4],tb:false};
  const t=L.p[0]+L.p[1],block=t===0?0:1+Math.floor((t-1)/2);
  return {server:o[(gamesPlayed+block)%4],tb:true};
}
/* returns events: 'game','set','match','ends','decided' */
function pcLivePoint(T,m,L,side){
  if(pcLiveState(T,m,L).done)return ['decided'];
  L.hist.push(JSON.stringify({sets:L.sets,g:L.g,p:L.p,deuces:L.deuces}));
  const st=pcLiveState(T,m,L),i=side==='a'?0:1,ev=[];
  L.p=L.p.slice();L.p[i]++;
  const [a,b]=L.p;let gameWon=null;
  if(st.tb){
    const t=a+b;
    if(Math.max(a,b)>=st.tbTo&&Math.abs(a-b)>=2)gameWon=a>b?'a':'b';
    else if(t%6===0)ev.push('ends');
    if(gameWon){
      const set=st.stb?{a,b,stb:true}:{a:L.g[0]+(a>b?1:0),b:L.g[1]+(b>a?1:0),ta:a,tb:b};
      L.sets=L.sets.concat([set]);L.g=[0,0];L.p=[0,0];L.deuces=0;ev.push('set');
    }
  }else{
    const was=[a-(i===0?1:0),b-(i===1?1:0)];
    const decisive=was[0]>=3&&was[1]>=3&&was[0]===was[1]&&(T.cfg.deuce==='golden'||(T.cfg.deuce==='star'&&L.deuces>=3));
    if(decisive)gameWon=side;
    else if((a>=4||b>=4)&&Math.abs(a-b)>=2)gameWon=a>b?'a':'b';
    else if(a>=3&&b>=3&&a===b){L.deuces=(L.deuces||0)+1;L.p=[3,3]}
    if(gameWon){
      L.g=L.g.slice();L.g[gameWon==='a'?0:1]++;L.p=[0,0];L.deuces=0;ev.push('game');
      const S=st.S,[ga,gb]=L.g,w=Math.max(ga,gb),l=Math.min(ga,gb);
      if((w===S&&l<=S-2)||(w===S+1&&l===S-1)){L.sets=L.sets.concat([{a:ga,b:gb}]);L.g=[0,0];ev.push('set')}
      if((ga+gb)%2===1&&!ev.includes('set'))ev.push('ends');
    }
  }
  if(ev.includes('set')){const last=L.sets[L.sets.length-1],tot=last.stb?1:(+last.a)+(+last.b);if(tot%2===1)ev.push('ends')}
  if(pcLiveState(T,m,L).done)ev.push('match');
  return ev;
}
function pcLiveUndo(L){if(!L.hist.length)return false;const s=JSON.parse(L.hist.pop());L.sets=s.sets;L.g=s.g;L.p=s.p;L.deuces=s.deuces;return true}

/* ================= table tennis: engine (no DOM) ================= */
const TT_UNIT={single:'Одиночный',pair:'Постоянные пары',rotate:'Пары со сменой партнёров'};
const TT_SCHEME={rr:'Круговой',groups:'Группы + плей-офф',ko:'Олимпийская сетка',rotate:'Американо'};
const TT_MIN={rr:3,ko:3,groups:6};
let ttPrev={key:'',sched:null};
function freshTTDraft(){return {name:'',level:'simple',unit:'single',scheme:null,players:[],pts:11,wins:{g:2,ko:3,f:3},rwins:1,tables:2,cycles:null,groupCount:null,advance:2,third:true,consolation:false,seeding:'random',rounds:null}}
/* entrants: players (single, rotate) or fixed pairs */
const ttEntrantCount=d=>d.unit==='pair'?Math.floor(d.players.length/2):d.players.length;
function ttMaxTables(d){const n=ttEntrantCount(d);return Math.max(1,d.unit==='rotate'?Math.floor(n/4):Math.floor(n/2))}
const ttTables=d=>Math.max(1,Math.min(d.tables||1,ttMaxTables(d)));
function ttGroupOptions(n){const out=[];for(let g=2;g<=Math.floor(n/3);g++){if(Math.floor(n/g)>=3&&Math.ceil(n/g)<=6)out.push(g)}return out}
function ttDefaultGroups(n){const o=ttGroupOptions(n);if(!o.length)return null;return o.reduce((b,g)=>Math.abs(n/g-4)<Math.abs(n/b-4)?g:b,o[0])}
function ttRecommend(n){return n<=7?{scheme:'rr',cycles:n<=3?2:1}:{scheme:'groups',cycles:1,groupCount:ttDefaultGroups(n),advance:2}}
function ttGroupSizes(n,g){const s=Array(g).fill(Math.floor(n/g));for(let i=0;i<n%g;i++)s[i]++;return s}
const TT_MIN_PER_MATCH={1:7,2:13,3:22,4:32};
const ttMatchMinutes=(wins,pts)=>Math.round((TT_MIN_PER_MATCH[wins]||13)*Math.max(.6,pts/11));
/* everything the setup screen needs to know, and whether the tournament can start */
function ttPlan(d){
  const n=ttEntrantCount(d),P={n,unit:d.unit,tables:ttTables(d),maxTables:ttMaxTables(d)};
  if(d.unit==='pair'&&d.players.length%2)return {...P,ok:false,err:'Нужно чётное число игроков — у одного нет пары'};
  if(d.unit==='rotate'){
    if(n<4)return {...P,ok:false,err:'Нужно минимум 4 игрока'};
    const c=P.tables,act=activeCount(n,c),step=restStep(n,c);
    if(n%4<2){const key=n+'#'+c;if(ttPrev.key!==key)ttPrev={key,sched:buildAmericanoFull(n,c)};
      return {...P,ok:true,scheme:'rotate',full:true,games:n-1,rounds:ttPrev.sched.length,matches:n*(n-1)/4,minutes:ttEstimate(n*(n-1)/4,0,0,d,c)}}
    const def=Math.ceil((n-1)/step)*step,R=(d.rounds&&d.rounds%step===0)?d.rounds:def;
    return {...P,ok:true,scheme:'rotate',full:false,step,rounds:R,games:R*act/n,rest:n-act,matches:R*act/4,minutes:ttEstimate(R*act/4,0,0,d,c)};
  }
  const rec=ttRecommend(n),scheme=d.scheme||rec.scheme;P.scheme=scheme;P.recommended=rec.scheme;
  const who=d.unit==='pair'?'пары':'игрока';
  if(n<TT_MIN[scheme])return {...P,ok:false,err:`Для формата «${TT_SCHEME[scheme]}» нужно минимум ${TT_MIN[scheme]} ${scheme==='groups'?(d.unit==='pair'?'пар':'игроков'):who}`};
  if(scheme==='rr'){const cy=d.cycles||rec.cycles||1,m=cy*n*(n-1)/2;return {...P,ok:true,cycles:cy,matches:m,games:cy*(n-1),minutes:ttEstimate(m,0,0,d,P.tables)}}
  if(scheme==='ko'){let S=2;while(S<n)S*=2;const third=d.third&&n>=4?1:0,m=n-1+third;
    return {...P,ok:true,size:S,byes:S-n,matches:m,minutes:ttEstimate(m-1-third,0,1+third,d,P.tables)}}
  const opts=ttGroupOptions(n),g=opts.includes(d.groupCount)?d.groupCount:ttDefaultGroups(n);
  const sizes=ttGroupSizes(n,g),adv=Math.min(d.advance||2,2),q=g*adv;
  let gm=0;sizes.forEach(s=>gm+=s*(s-1)/2);
  const third=d.third&&q>=4?1:0,ko=q-1+third,rest=n-q,cons=d.consolation&&rest>=2?rest-1:0;
  return {...P,ok:true,groupOptions:opts,groupCount:g,sizes,advance:adv,qualifiers:q,matches:gm+ko+cons,groupMatches:gm,koMatches:ko,consMatches:cons,
    minutes:ttEstimate(gm,ko-1-third+cons,1+third,d,P.tables)};
}
function ttEstimate(gMatches,koMatches,finals,d,tables){
  if(d.sport==='pc')return Math.round((gMatches+koMatches+finals)*pcMinutes(d)/Math.max(1,tables)*1.1);
  const p=d.pts||11,mins=gMatches*ttMatchMinutes(d.unit==='rotate'?d.rwins:d.wins.g,p)+koMatches*ttMatchMinutes(d.wins.ko,p)+finals*ttMatchMinutes(d.wins.f,p);
  return Math.round(mins/Math.max(1,tables)*1.15);
}
const fmtMinutes=m=>m<60?`${m} мин`:`${Math.floor(m/60)} ч${m%60?` ${m%60} мин`:''}`;

/* ---------- game / match score rules (ITTF): a game is won at `pts` with a 2-point lead ---------- */
function ttGameErr(x,y,pts){
  if(x===''||y===''||x==null||y==null)return 'Введите счёт партии';
  x=Number(x);y=Number(y);
  if(!Number.isInteger(x)||!Number.isInteger(y)||x<0||y<0)return 'Счёт — целые числа от 0';
  if(x>99||y>99)return 'Слишком большой счёт';
  if(x===y)return 'В партии не бывает ничьей';
  const w=Math.max(x,y),l=Math.min(x,y);
  if(w<pts)return `Партия идёт до ${pts} очков`;
  if(l<=pts-2&&w!==pts)return `При ${l} у проигравшего победитель набирает ровно ${pts}`;
  if(l>=pts-1&&w!==l+2)return `После ${pts-1}:${pts-1} нужен отрыв в 2 очка — например ${l+2}:${l}`;
  return null;
}
/* games: [[a,b],...]; need = wins needed. Returns {err} or {win:'a'|'b'} */
function ttMatchCheck(games,need,pts){
  if(!games.length)return {err:'Введите счёт хотя бы одной партии'};
  let wa=0,wb=0;
  for(let i=0;i<games.length;i++){
    if(wa===need||wb===need)return {err:`Матч уже закончился после ${i}-й партии — лишняя партия`};
    const e=ttGameErr(games[i][0],games[i][1],pts);if(e)return {err:`Партия ${i+1}: ${e}`};
    if(+games[i][0]>+games[i][1])wa++;else wb++;
  }
  if(wa<need&&wb<need)return {err:`Матч идёт до ${need} ${plural(need,'победы','побед','побед')} в партиях — сейчас ${wa}:${wb}`};
  return {win:wa>wb?'a':'b',wa,wb};
}
const ttNeed=(T,m)=>T.sport==='pc'?pcNeed(T.cfg):T.unit==='rotate'?T.cfg.rwins:m.final?T.cfg.wins.f:(m.ph==='ko'||m.ph==='third'||m.ph==='cons')?T.cfg.wins.ko:T.cfg.wins.g;

/* validate a whole match result for either sport */
const ttCheck=(T,m,games)=>T.sport==='pc'?pcMatchCheck(games,T.cfg):ttMatchCheck(games,ttNeed(T,m),T.cfg.pts);
/* ---------- live scoring: who serves, when to change ends ---------- */
/* state: {games:[[a,b]...], cur:[a,b], first:'a'|'b' (singles: side serving first in game 1), dbl:{s,r} player ids for doubles game 1, hist:[]} */
function ttServeInfo(T,m,L){
  const pts=T.cfg.pts,g=L.games.length,[a,b]=L.cur,t=a+b,need=ttNeed(T,m);
  const dz=2*(pts-1);const block=t<dz?Math.floor(t/2):(pts-1)+(t-dz);
  const deciding=g===2*need-2;
  const sideFirst=g%2===0?L.first:(L.first==='a'?'b':'a');
  const info={deciding};
  if(!L.dbl){info.server=(block%2===0)?sideFirst:(sideFirst==='a'?'b':'a');return info}
  /* doubles: cycle S→R→S'→R'; next game the previous first receiver serves first to the player who served to him */
  const pa=ttSide(T,m,'a'),pb=ttSide(T,m,'b'),partner=p=>pa.includes(p)?pa.find(x=>x!==p):pb.find(x=>x!==p);
  let S=L.dbl.s,R=L.dbl.r;
  for(let i=0;i<g;i++){const ns=R,nr=S;S=ns;R=nr}
  let cyc=[S,R,partner(S),partner(R)];
  /* deciding game: when a side first reaches 5, the receiving pair changes its order */
  if(deciding&&L.switchAt!=null&&t>=L.switchAt){
    const b0=L.switchBlock,s0=cyc[b0%4],r0=cyc[(b0+1)%4],c2=[];
    c2[b0%4]=s0;c2[(b0+1)%4]=partner(r0);c2[(b0+2)%4]=partner(s0);c2[(b0+3)%4]=r0;cyc=c2;
  }
  info.server=cyc[block%4];info.receiver=cyc[(block+1)%4];
  info.serverSide=pa.includes(info.server)?'a':'b';
  return info;
}
/* a finished match accepts no more points until it is saved or the last point is undone */
function ttLiveDecided(T,m,L){const need=ttNeed(T,m),wa=L.games.filter(g=>g[0]>g[1]).length,wb=L.games.length-wa;return {wa,wb,need,done:wa>=need||wb>=need}}
function ttLivePoint(T,m,L,side){
  if(ttLiveDecided(T,m,L).done)return ['decided'];
  const pts=T.cfg.pts,need=ttNeed(T,m);
  L.hist.push(JSON.stringify({games:L.games,cur:L.cur,switchAt:L.switchAt,switchBlock:L.switchBlock}));
  L.cur=L.cur.slice();L.cur[side==='a'?0:1]++;
  const [a,b]=L.cur,t=a+b,deciding=L.games.length===2*need-2;
  const events=[];
  if(deciding&&L.switchAt==null&&(a===5||b===5)&&Math.max(a,b)===5&&Math.min(a,b)<5){
    L.switchAt=t;const dz=2*(pts-1);L.switchBlock=t<dz?Math.floor(t/2):(pts-1)+(t-dz);events.push('ends');
  }
  const w=Math.max(a,b),l=Math.min(a,b);
  if(w>=pts&&w-l>=2){
    L.games=L.games.concat([[a,b]]);L.cur=[0,0];L.switchAt=null;L.switchBlock=null;
    const wa=L.games.filter(x=>x[0]>x[1]).length,wb=L.games.length-wa;
    if(wa===need||wb===need)events.push('match');else events.push('game');

}
function ttLiveUndo(L){if(!L.hist.length)return false;const s=JSON.parse(L.hist.pop());L.games=s.games;L.cur=s.cur;L.switchAt=s.switchAt;L.switchBlock=s.switchBlock;return true}

/* ---------- building the tournament ---------- */
function ttSide(T,m,s){const v=s==='a'?m.a:m.b;if(v==null)return [];return T.unit==='rotate'?v:T.entrants[v].m}
function ttSideName(T,m,s){const v=s==='a'?m.a:m.b;if(v==null)return m['wait'+s]||'—';return T.unit==='rotate'?v.map(p=>T.players[p]).join(' / '):T.entrants[v].name}
function ttNewMatch(T,ph,o){const m={id:T.seq++,ph,a:null,b:null,games:[],st:'open',win:null,wo:null,table:null,...o};T.matches.push(m);return m}
/* round robin with the circle method; the round where the two top seeds meet goes last */
function ttRRMatches(T,list,ph,g,cycles){
  const n=list.length,ids=list.slice();if(n%2)ids.push(-1);const m=ids.length,rounds=[];
  for(let r=0;r<m-1;r++){const pairs=[];
    const add=(x,y)=>{if(ids[x]>=0&&ids[y]>=0)pairs.push([ids[x],ids[y]])};
    add(m-1,r);for(let i=1;i<m/2;i++)add((r+i)%(m-1),(r-i+m-1)%(m-1));rounds.push(pairs)}
  const top=rounds.findIndex(p=>p.some(([x,y])=>(x===list[0]&&y===list[1])||(x===list[1]&&y===list[0])));
  if(top>=0)rounds.push(rounds.splice(top,1)[0]);
  let r0=0;
  for(let c=0;c<(cycles||1);c++)rounds.forEach((pairs,ri)=>{pairs.forEach(([x,y])=>ttNewMatch(T,ph,{g,r:r0+ri,a:c%2?y:x,b:c%2?x:y}));});
}
function ttSeedOrder(S){let o=[1];while(o.length<S){const L=o.length*2,n=[];o.forEach(s=>{n.push(s,L+1-s)});o=n}return o}
/* single-elimination bracket for `list` (entrant ids in seed order); byes go to the top seeds */
function ttKO(T,list,ph,third){
  const n=list.length;let S=2;while(S<n)S*=2;const order=ttSeedOrder(S),R=Math.log2(S);
  const rounds=[[]];
  for(let i=0;i<S/2;i++){const sa=order[2*i],sb=order[2*i+1];
    rounds[0].push(ttNewMatch(T,ph,{r:0,a:sa<=n?list[sa-1]:null,b:sb<=n?list[sb-1]:null,ra:true,rb:true,rounds:R}))}
  for(let r=1;r<R;r++){rounds[r]=[];const prev=rounds[r-1];
    for(let i=0;i<prev.length/2;i++)rounds[r].push(ttNewMatch(T,ph,{r,src:{a:{w:prev[2*i].id},b:{w:prev[2*i+1].id}},rounds:R}))}
  const fin=rounds[R-1][0];if(ph==='ko')fin.final=true;
  if(third&&R>=2){const semis=rounds[R-2];ttNewMatch(T,ph==='ko'?'third':ph+'3',{r:R-1,src:{a:{l:semis[0].id},b:{l:semis[1].id}},rounds:R,isThird:true})}
}
function ttStartPlay(d,id){
  const n=ttEntrantCount(d),P=ttPlan(d);if(!P.ok)return {err:P.err};
  const T={id,sport:d.sport==='pc'?'pc':'tt',level:d.level||'simple',name:'',unit:d.unit,scheme:P.scheme,players:d.players.slice(),entrants:[],matches:[],seq:1,
    cfg:{pts:d.pts,wins:{...d.wins},rwins:d.rwins,deuce:d.deuce,fmt:d.fmt,dec:d.dec,tables:P.tables,cycles:P.cycles||1,groupCount:P.groupCount||null,advance:P.advance||null,third:!!d.third,consolation:!!d.consolation,seeding:d.seeding},
    stage:'play',status:'active',planned:P.matches};
  if(d.unit==='pair')for(let i=0;i<n;i++)T.entrants.push({name:d.players[2*i]+' / '+d.players[2*i+1],m:[2*i,2*i+1]});
  else T.players.forEach((p,i)=>T.entrants.push({name:p,m:[i]}));
  T.entrants.forEach(e=>e.lot=Math.random());
  const seeded=d.seeding==='manual'?[...Array(n).keys()]:shuffle([...Array(n).keys()]);
  T.entrants.forEach((e,i)=>e.seed=seeded.indexOf(i)+1);
  if(P.scheme==='rotate'){
    const sched=P.full?clone(ttPrev.sched):buildEqualGames(n,P.tables,P.rounds);ttPrev={key:'',sched:null};
    sched.forEach((R,ri)=>R.matches.forEach(mm=>ttNewMatch(T,'am',{r:ri,a:mm.t1.slice(),b:mm.t2.slice()})));
    T.rounds=sched.length;
  }else if(P.scheme==='rr')ttRRMatches(T,seeded,'rr',null,P.cycles);
  else if(P.scheme==='ko')ttKO(T,seeded,'ko',d.third&&n>=4);
  else{
    const g=P.groupCount;T.groups=[...Array(g)].map(()=>[]);
    seeded.forEach((e,i)=>{const row=Math.floor(i/g),col=i%g;T.groups[row%2?g-1-col:col].push(e)});
    T.groups.forEach((list,gi)=>ttRRMatches(T,list,'g',gi,1));
    T.groupStage=true;
  }
  ttPropagate(T);ttAssignTables(T);
  return {T};
}

/* ---------- results flow ---------- */
const ttDone=m=>m.st==='done';
const ttOut=(T,e)=>T.unit!=='rotate'&&e!=null&&T.entrants[e].out;
function ttWinnerOf(m){if(!ttDone(m)||!m.win)return null;return m.win==='a'?m.a:m.b}
function ttLoserOf(m){if(!ttDone(m)||!m.win||m.bye)return null;return m.win==='a'?m.b:m.a}
/* fill bracket slots from finished matches, auto-advance byes and withdrawn players; repeat until stable */
function ttPropagate(T){
  let changed=true,guard=0;
  while(changed&&guard++<200){changed=false;
    T.matches.forEach(m=>{
      if(m.src)['a','b'].forEach(s=>{const k='r'+s;if(m[k])return;const src=m.src[s],sm=T.matches.find(x=>x.id===(src.w??src.l));
        if(sm&&ttDone(sm)){m[s]=src.w!=null?ttWinnerOf(sm):ttLoserOf(sm);m[k]=true;changed=true}});
      if(m.st!=='done'&&(m.ra||!m.src)&&(m.rb||!m.src)){
        const A=m.a,B=m.b;
        if(m.src||m.ph==='ko'||m.ph==='cons'){
          if(A==null&&B==null){m.st='done';m.bye=true;m.win=null;changed=true;return}
          if(A==null||B==null){m.st='done';m.bye=true;m.win=A==null?'b':'a';changed=true;return}
        }
        if(T.unit!=='rotate'&&A!=null&&B!=null&&(ttOut(T,A)||ttOut(T,B))&&!m.live){
          m.st='done';m.games=[];m.wo=ttOut(T,A)?(ttOut(T,B)?'ab':'a'):'b';m.win=m.wo==='a'?'b':m.wo==='b'?'a':null;
          if(m.wo==='ab'){m.bye=true;m.win=null}changed=true}
      }
    });
  }
  if(T.groupStage&&T.matches.filter(m=>m.ph==='g').every(ttDone)&&!T.matches.some(m=>m.ph==='ko'))ttMakePlayoff(T);
  const left=T.matches.filter(m=>!ttDone(m));
  if(!left.length&&T.stage==='play'){T.stage='results'}
}
function ttMakePlayoff(T){
  const ranks=T.groups.map((list,gi)=>ttRank(T,list,T.matches.filter(m=>m.ph==='g'&&m.g===gi)).order);
  const adv=T.cfg.advance,firsts=ranks.map(r=>r[0]),seconds=adv>1?ranks.map(r=>r[1]):[];
  let best=null,bestCost=1e9;
  const tryOrder=sec=>{const list=firsts.concat(sec);const c=ttSameGroupCost(T,list);if(c<bestCost){bestCost=c;best=list}};
  if(seconds.length<=7)ttPermute(seconds).forEach(tryOrder);else for(let k=0;k<seconds.length;k++){tryOrder(seconds.slice(k).concat(seconds.slice(0,k)));tryOrder(seconds.slice(k).concat(seconds.slice(0,k)).reverse())}
  ttKO(T,best||firsts.concat(seconds),'ko',T.cfg.third&&best.length>=4);
  if(T.cfg.consolation){const rest=[];for(let p=adv;p<6;p++)ranks.forEach(r=>{if(r[p]!=null)rest.push(r[p])});if(rest.length>=2)ttKO(T,rest,'cons',false)}
  T.groupRanks=ranks;
}
function ttPermute(a){if(a.length<=1)return [a.slice()];const out=[];a.forEach((x,i)=>ttPermute(a.slice(0,i).concat(a.slice(i+1))).forEach(p=>out.push([x].concat(p))));return out}
/* players from one group should meet as late as possible in the bracket */
function ttSameGroupCost(T,list){
  const n=list.length;let S=2;while(S<n)S*=2;const order=ttSeedOrder(S),pos={};order.forEach((s,i)=>pos[s]=i);
  const R=Math.log2(S),grp=e=>T.groups.findIndex(g=>g.includes(e));let cost=0;
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)if(grp(list[i])===grp(list[j])){let a=pos[i+1],b=pos[j+1],r=0;while(a!==b){a>>=1;b>>=1;r++}cost+=Math.pow(10,R-r)}
  return cost;
}
function ttAssignTables(T){
  const busy=new Set(),used=new Set();
  T.matches.forEach(m=>{if(m.st!=='done'&&m.table!=null){used.add(m.table);ttSide(T,m,'a').concat(ttSide(T,m,'b')).forEach(p=>busy.add(p))}else if(m.st==='done')m.table=null});
  const prio=m=>(m.ph==='g'||m.ph==='rr'||m.ph==='am'?0:m.ph==='cons'?1:2)*1000+(m.r||0)*10+(m.isThird?1:0);
  const ready=T.matches.filter(m=>m.st!=='done'&&m.table==null&&m.a!=null&&m.b!=null).sort((x,y)=>prio(x)-prio(y)||x.id-y.id);
  for(const m of ready){
    let free=null;for(let t=1;t<=T.cfg.tables;t++)if(!used.has(t)){free=t;break}
    if(free==null)break;
    const ps=ttSide(T,m,'a').concat(ttSide(T,m,'b'));if(ps.some(p=>busy.has(p)))continue;
    m.table=free;used.add(free);ps.forEach(p=>busy.add(p));
  }
}
/* record a result; games already validated */
function ttSetResult(T,m,games,win,wo){
  m.games=games;m.win=win;m.wo=wo||null;m.st='done';m.live=null;m.table=null;
  ttPropagate(T);ttAssignTables(T);
}
/* can this finished match still be corrected without breaking later rounds? */
function ttCanEdit(T,m){
  if(m.bye)return {ok:false,why:'Это пропуск круга — счёта нет'};
  if(m.wo&&T.unit!=='rotate'&&(ttOut(T,m.a)||ttOut(T,m.b)))return {ok:false,why:'Игрок снят с турнира — техническое поражение не исправляется'};
  if(m.ph==='g'&&T.matches.some(x=>(x.ph==='ko'||x.ph==='cons'||x.ph==='third')&&ttDone(x)&&!x.bye))return {ok:false,why:'Плей-офф уже начался — результаты групп изменить нельзя'};
  const dep=T.matches.filter(x=>x.src&&((x.src.a&&(x.src.a.w===m.id||x.src.a.l===m.id))||(x.src.b&&(x.src.b.w===m.id||x.src.b.l===m.id))));
  if(dep.some(x=>ttDone(x)&&!x.bye))return {ok:false,why:'Следующий матч сетки уже сыгран — сначала исправьте его'};
  return {ok:true};
}
function ttReopen(T,m){
  const reset=x=>{T.matches.filter(y=>y.src&&((y.src.a&&(y.src.a.w===x.id||y.src.a.l===x.id))||(y.src.b&&(y.src.b.w===x.id||y.src.b.l===x.id)))).forEach(y=>{
    ['a','b'].forEach(s=>{const src=y.src[s];if(src.w===x.id||src.l===x.id){y[s]=null;y['r'+s]=false}});
    if(y.st==='done'){y.st='open';y.win=null;y.bye=false;y.wo=null;y.games=[];reset(y)}})};
  if(m.ph==='g'&&T.matches.some(x=>x.ph==='ko'||x.ph==='cons'||x.ph==='third')){T.matches=T.matches.filter(x=>x.ph==='g'||x.ph==='rr'||x.ph==='am');T.groupRanks=null}
  reset(m);m.st='open';m.win=null;m.wo=null;m.games=[];m.table=null;T.stage='play';
  ttPropagate(T);ttAssignTables(T);
}
function ttWithdraw(T,e){
  T.entrants[e].out=true;
  T.matches.forEach(m=>{if(m.st!=='done'&&(m.a===e||m.b===e)){m.live=null}});
  ttPropagate(T);ttAssignTables(T);
}

/* ---------- standings (ITTF 3.7.5): match points 2 / 1 / 0, ties by results between the tied players ---------- */
function ttTally(T,ids,matches,key){
  const s={};ids.forEach(e=>s[key(e)]={mp:0,w:0,l:0,gw:0,gl:0,pw:0,pl:0,g:0});
  matches.forEach(m=>{if(!ttDone(m)||m.bye||!m.win)return;
    const A=T.unit==='rotate'?m.a:[m.a],B=T.unit==='rotate'?m.b:[m.b];
    const apply=(list,won,wo)=>list.forEach(e=>{const o=s[key(e)];if(!o)return;o.g++;if(won){o.w++;o.mp+=2}else{o.l++;o.mp+=wo?0:1}});
    const aWon=m.win==='a';apply(A,aWon,m.wo==='a');apply(B,!aWon,m.wo==='b');
    if(!m.wo)m.games.forEach(g=>{let x,y,gx,gy;
      if(T.sport==='pc'){x=+g.a;y=+g.b;gx=g.stb?(x>y?1:0):x;gy=g.stb?(y>x?1:0):y}else{x=+g[0];y=+g[1];gx=x;gy=y}
      A.forEach(e=>{const o=s[key(e)];if(!o)return;o.pw+=gx;o.pl+=gy;if(x>y)o.gw++;else o.gl++});
      B.forEach(e=>{const o=s[key(e)];if(!o)return;o.pw+=gy;o.pl+=gx;if(y>x)o.gw++;else o.gl++})});
  });
  return s;
}
const ttRatio=(a,b)=>b===0?(a===0?1:Infinity):a/b;
function ttRank(T,ids,matches){
  const key=e=>e;const tieInfo={};const all=ttTally(T,ids,matches,key);
  const resolve=(sub)=>{
    if(sub.length<=1)return sub;
    const inner=matches.filter(m=>sub.includes(m.a)&&sub.includes(m.b));
    const s=ttTally(T,sub,inner,key);
    const crit=T.sport==='pc'
      ?[e=>s[e].mp,e=>s[e].gw-s[e].gl,e=>s[e].pw-s[e].pl,e=>all[e].gw-all[e].gl,e=>all[e].pw-all[e].pl]
      :[e=>s[e].mp,e=>ttRatio(s[e].gw,s[e].gl),e=>ttRatio(s[e].pw,s[e].pl)];
    for(const c of crit){
      const vals=[...new Set(sub.map(c))];
      if(vals.length>1){vals.sort((x,y)=>y-x);return vals.flatMap(v=>resolve(sub.filter(e=>c(e)===v)))}
    }
    sub.forEach(e=>tieInfo[e]=true);
    return sub.slice().sort((x,y)=>T.entrants[x].lot-T.entrants[y].lot);
  };
  const byMp=[...new Set(ids.map(e=>all[e].mp))].sort((x,y)=>y-x);
  const order=byMp.flatMap(v=>resolve(ids.filter(e=>all[e].mp===v)));
  return {order,stats:all,lot:tieInfo};
}
/* rotating partners: individual table, overall ratios (no head-to-head between changing pairs) */
function ttRankPlayers(T){
  const ids=T.players.map((p,i)=>i),s=ttTally(T,ids,T.matches,e=>e);
  const order=ids.slice().sort((x,y)=>s[y].mp-s[x].mp||ttRatio(s[y].gw,s[y].gl)-ttRatio(s[x].gw,s[x].gl)||ttRatio(s[y].pw,s[y].pl)-ttRatio(s[x].pw,s[x].pl)||T.entrants[x].lot-T.entrants[y].lot);
  return {order,stats:s};
}
/* final places for the whole tournament: [{e,name,place,p1,tie,st}] */
function ttFinal(T){
  const rows=[];
  const statsAll=T.unit==='rotate'?ttTally(T,T.players.map((p,i)=>i),T.matches,e=>e):ttTally(T,T.entrants.map((x,i)=>i),T.matches,e=>e);
  const push=(list,start)=>{list.forEach(e=>rows.push({e,name:T.entrants[e].name,p1:start,place:list.length>1?`${start}–${start+list.length-1}`:String(start),tie:list.length>1,st:statsAll[e]}))};
  if(T.scheme==='rotate'||T.scheme==='rr'){
    const R=T.scheme==='rotate'?ttRankPlayers(T):ttRank(T,T.entrants.map((x,i)=>i),T.matches);
    R.order.forEach((e,i)=>rows.push({e,name:T.entrants[e].name,p1:i+1,place:String(i+1),st:statsAll[e],lot:R.lot&&R.lot[e]}));
    return rows;
  }
  const koPlaces=(ph,thirdPh,offset)=>{
    const ms=T.matches.filter(m=>m.ph===ph);if(!ms.length)return 0;
    const R=ms[0].rounds,inB=new Set();ms.filter(m=>m.r===0).forEach(m=>{if(m.a!=null)inB.add(m.a);if(m.b!=null)inB.add(m.b)});
    const lostIn={};ms.forEach(m=>{const l=ttLoserOf(m);if(l!=null)lostIn[l]=m.r});
    const fin=ms.find(m=>m.r===R-1),champ=fin?ttWinnerOf(fin):null;
    const th=T.matches.find(m=>m.ph===thirdPh);
    let place=offset+1;
    if(champ!=null){push([champ],place);place++}
    for(let r=R-1;r>=0;r--){
      let lost=[...inB].filter(e=>lostIn[e]===r&&e!==champ);
      if(r===R-2&&th&&ttDone(th)&&th.win){const w=ttWinnerOf(th),l=ttLoserOf(th);if(w!=null){push([w],place);place++}if(l!=null){push([l],place);place++}lost=lost.filter(e=>e!==w&&e!==l)}
      if(lost.length){push(lost,place);place+=lost.length}
    }
    const undecided=[...inB].filter(e=>!rows.some(x=>x.e===e));if(undecided.length){push(undecided,place);place+=undecided.length}
    return place-1-offset;
  };
  let used=koPlaces('ko','third',0);
  if(T.scheme==='groups'){
    used+=koPlaces('cons','cons3',used);
    if(T.groupRanks){const maxLen=Math.max(...T.groupRanks.map(r=>r.length));
      for(let p=0;p<maxLen;p++){const list=T.groupRanks.map(r=>r[p]).filter(e=>e!=null&&!rows.some(x=>x.e===e));if(list.length){push(list,used+1);used+=list.length}}}
    else{const R=ttRank(T,T.entrants.map((x,i)=>i),T.matches.filter(m=>m.ph==='g'));R.order.forEach(e=>{if(!rows.some(x=>x.e===e)){push([e],used+1);used++}})}
  }
  return rows;
}
const ttProgress=T=>{const real=T.matches.filter(m=>!m.bye||m.cancelled);return {done:real.filter(m=>ttDone(m)&&!m.cancelled).length,all:T.scheme==='groups'&&!T.matches.some(m=>m.ph==='ko')?Math.max(real.length,T.planned||0):real.length}};

    document.querySelectorAll('.gin').forEach(el=>{const i=+el.dataset.g,row=[...document.querySelectorAll(`.gin[data-g="${i}"]`)].map(x=>x.value);
      el.classList.toggle('bad',row[0]!==''&&row[1]!==''&&!!ttGameErr(row[0],row[1],T.cfg.pts))})};
  document.querySelectorAll('.gin').forEach((el,idx,all)=>{el.addEventListener('input',upd);
    el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const nx=all[idx+1];if(nx)nx.focus();else el.blur()}})});

}
function ttReadGames(){
  const rows={};document.querySelectorAll('.gin').forEach(el=>{(rows[el.dataset.g]=rows[el.dataset.g]||[])[+el.dataset.s]=el.value.trim()});
  const list=[];let gap=false;
  for(const k of Object.keys(rows).sort((a,b)=>a-b)){const [x,y]=rows[k];
    if(x===''&&y===''){gap=true;continue}
    if(gap)return {err:`Пропущена партия перед партией ${+k+1}`,list};
    if(x===''||y==='')return {err:`Партия ${+k+1}: введите счёт обоих`,list};
    list.push([+x,+y])}
  return {list};
}

/* ================= table tennis: actions ================= */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='pick'){if(b.dataset.v==='tt'){store.ttdraft=store.ttdraft||freshTTDraft();return go('ttsetup',null)}return go('setup',null)}
  if(!a.startsWith('tt-'))return;
  const d=store.ttdraft,T=cur(),M=T&&T.matches?T.matches.find(x=>x.id===+b.dataset.m):null;
  const redraw=()=>{saveLocal();render()};
  switch(a){
    case 'tt-unit':d.unit=b.dataset.v;d.rounds=null;buzz();return redraw();
    case 'tt-level':d.level=b.dataset.v;if(d.level==='pro'&&!d.proSet){d.wins={g:3,ko:3,f:4};d.pts=11;d.proSet=true}buzz();return redraw();
    case 'tt-scheme':{const n=ttEntrantCount(d);if(n<TT_MIN[b.dataset.v]){$('#e-cfg').textContent=`Для формата «${TT_SCHEME[b.dataset.v]}» нужно минимум ${TT_MIN[b.dataset.v]} ${d.unit==='pair'?'пар':'игроков'}`;return}d.scheme=b.dataset.v;return redraw()}
    case 'tt-cycles':{const P=ttPlan(ttEff(d));d.cycles=Math.min(3,Math.max(1,(P.cycles||1)+ +b.dataset.d));buzz();return redraw()}
    case 'tt-groups':d.groupCount=+b.dataset.v;return redraw();
    case 'tt-adv':d.advance=+b.dataset.v;return redraw();
    case 'tt-third':d.third=!d.third;return redraw();
    case 'tt-cons':d.consolation=!d.consolation;return redraw();
    case 'tt-seed':d.seeding=b.dataset.v;return redraw();
    case 'tt-pts':d.pts=+b.dataset.v;return redraw();
    case 'tt-rwins':d.rwins=Math.min(4,Math.max(1,d.rwins+ +b.dataset.d));buzz();return redraw();
    case 'tt-tables':d.tables=Math.min(ttMaxTables(d),Math.max(1,ttTables(d)+ +b.dataset.d));d.rounds=null;buzz();return redraw();
    case 'tt-rounds':{const P=ttPlan(ttEff(d));if(!P.ok||!P.step)return;d.rounds=Math.max(P.step,Math.min(Math.floor(60/P.step)*P.step,P.rounds+ +b.dataset.d*P.step));buzz();return redraw()}
    case 'tt-start':return ttStartFromDraft();
    case 'tt-score':if(M&&M.st!=='done')(T.sport==='pc'?pcOpenScore:ttOpenScore)(T,M);return;

    case 'tt-fix':{if(!M)return;const c=ttCanEdit(T,M);if(!c.ok)return sheet('Нельзя исправить',c.why,[]);

function pcStartFromDraft(){

  if(r.err){$('#e-cfg').textContent=r.err;return}
  const T=r.T;T.name=(d.name.trim()||pcDefaultName()).slice(0,60);T.createdAt=Date.now();T.updatedAt=Date.now();T.level='pro';

  touch(T);go('play',id,'play');wake();
}

  <div class="stack" style="margin-top:14px">
    <button class="cta" data-a="pc-save">Сохранить результат</button>
    <button class="ghost" data-a="tt-scorex">Отмена</button>
  </div>`;

    const v=[];document.querySelectorAll('.gin').forEach(el=>{(v[+el.dataset.g]=v[+el.dataset.g]||{a:'',b:'',ta:'',tb:''})[el.dataset.s]=el.value});store.ui.scoreVals=v;saveLocal();
    document.querySelectorAll('.tbrow').forEach(r=>{const i=+r.dataset.tb,x=v[i]||{},a=+x.a,b=+x.b;r.hidden=!(x.a!==''&&x.b!==''&&Math.max(a,b)===S+1&&Math.min(a,b)===S)});

  upd();
}
function pcReadSets(T){
  const c=T.cfg,S=pcSetLen(c),need=pcNeed(c),rows={};
  document.querySelectorAll('.gin').forEach(el=>{(rows[el.dataset.g]=rows[el.dataset.g]||{})[el.dataset.s]=el.value.trim()});
  const list=[];let gap=false;
  for(const k of Object.keys(rows).sort((a,b)=>a-b)){const r=rows[k],dec=need>1&&+k===2*need-2&&c.dec==='stb';
    if((r.a||'')===''&&(r.b||'')===''){gap=true;continue}
    if(gap)return {err:`Пропущен сет перед ${dec?'супер-тай-брейком':'сетом '+(+k+1)}`,list};
    if(r.a===''||r.b==='')return {err:`${dec?'Супер-тай-брейк':'Сет '+(+k+1)}: введите счёт обеих пар`,list};
    const s=dec?{a:+r.a,b:+r.b,stb:true}:{a:+r.a,b:+r.b};
    if(!dec&&Math.max(s.a,s.b)===S+1&&Math.min(s.a,s.b)===S){s.ta=r.ta===''?'':+r.ta;s.tb=r.tb===''?'':+r.tb}
    list.push(s)}
  return {list};
}
function pcSaveScore(T,m){
  const r=pcReadSets(T);if(r.err){$('#serr').textContent=r.err;return}
  const c=pcMatchCheck(r.list,T.cfg);if(c.err){$('#serr').textContent=c.err;return}
  if(document.activeElement)document.activeElement.blur();
  store.ui.score=null;store.ui.scoreVals=null;
  ttSetResult(T,m,r.list,c.win,null);buzz();touch(T);store.ui.tab='play';render();scrollTo(0,0);
  if(T.stage!=='results')toast(`Сохранено: ${c.wa}:${c.wb} по сетам`);
}
