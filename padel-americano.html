  const L=m.live,pa=ttSide(T,m,'a'),pb=ttSide(T,m,'b');
  if(!L.order){
    const step=L.pick==null?1:2,list=step===1?pa.concat(pb):(pa.includes(L.pick)?pb:pa);
    app.innerHTML=`<div class="topbar"><button class="iconbtn" data-a="tt-livex" aria-label="Свернуть">${IC.home}</button><div style="flex:1"></div></div>
    <div class="eyebrow" style="margin-top:14px">${ttPhaseName(T,m)}</div><h1 class="big">${step===1?'Кто подаёт первым?':'Кто подаёт первым у соперников?'}</h1>
    <p class="sub">${step===1?'Пара, выигравшая жребий, выбирает подающего.':'Этот игрок подаёт во втором гейме.'}</p>
    <div class="stack" style="margin-top:14px">${list.map(p=>`<button class="sportcard" data-a="pc-pick" data-v="${p}"><span style="min-width:0"><b>${esc(T.players[p])}</b><span>${pa.includes(p)?esc(ttSideName(T,m,'a')):esc(ttSideName(T,m,'b'))}</span></span><span class="chev">›</span></button>`).join('')}
    ${step===1?'<button class="ghost" data-a="pc-lot">Жребий</button>':''}</div>`;return;
  }
  const st=pcLiveState(T,m,L);
  if(st.done){
    const cool=L.decidedAt&&Date.now()-L.decidedAt<1000;
    app.innerHTML=`<div class="topbar"><button class="iconbtn" data-a="tt-livex" aria-label="Свернуть">${IC.home}</button><div style="flex:1"></div></div>
    <div class="eyebrow" style="margin-top:14px">${ttPhaseName(T,m)}</div><h1 class="big">Матч окончен</h1>
    <section class="card" style="margin-top:14px;text-align:center">
      <div class="lname">${esc(ttSideName(T,m,'a'))} — ${esc(ttSideName(T,m,'b'))}</div>
      <div class="lpts" style="font-size:72px">${st.wa}:${st.wb}</div>
      <div class="hint">Сеты: ${L.sets.map(pcSetText).join(' · ')}</div>
      <div style="margin-top:8px;font-weight:800">Победа: ${esc(ttSideName(T,m,st.wa>st.wb?'a':'b'))}</div>
    </section>
    <div class="stack ${cool?'cool':''}" style="margin-top:14px">
      <button class="cta" data-a="pc-livesave">Сохранить результат</button>
      <button class="ghost" data-a="pc-undo">Отменить последнее очко</button>
    </div>`;
    if(cool)setTimeout(()=>{if(store.ui.live===m.id)render()},1000-(Date.now()-L.decidedAt));return;
  }
  const lab=pcPointLabel(T,m,L),si=pcServeInfo(T,m,L),srvSide=pa.includes(si.server)?'a':'b';
  const decisive=pcDecisive(T,L);
  const half=s=>{const i=s==='a'?0:1,serving=srvSide===s;
    return `<button class="livehalf ${serving?'serving pad':''}" data-a="pc-pt" data-v="${s}" aria-label="Очко: ${esc(ttSideName(T,m,s))}">
      <span class="lname">${esc(ttSideName(T,m,s))}</span>
      <span class="lpts">${lab[i]}</span>
      <span class="lgames">Геймы: <b>${L.g[i]}</b> · сеты: <b>${s==='a'?st.wa:st.wb}</b></span>
      ${serving?`<span class="lserve pad"><i class="ballico"></i>подаёт ${esc(T.players[si.server])}</span>`:''}
    </button>`};
  const what=st.stb?'Супер-тай-брейк до 10':st.tb?'Тай-брейк до 7':`Сет ${L.sets.length+1}`;
  app.innerHTML=`<div class="topbar"><button class="iconbtn" data-a="tt-livex" aria-label="Свернуть">${IC.home}</button>
    <div style="flex:1;text-align:center;padding-top:4px"><div class="eyebrow">${ttPhaseName(T,m)}</div><div class="sub" style="font-size:13px">${what} · ${PC_DEUCE[T.cfg.deuce]}</div></div>
    <button class="iconbtn" data-a="pc-undo" aria-label="Отменить очко">↶</button></div>
    ${decisive?`<div class="decisive">Решающее очко — ${T.cfg.deuce==='star'?'стар-пойнт':'золотое очко'}. Принимающие выбирают сторону</div>`:''}
    <div class="livewrap">${half('a')}${half('b')}</div>
    ${L.sets.length?`<div class="rest" style="justify-content:center;margin-top:10px">Сеты: ${L.sets.map(pcSetText).join(' · ')}</div>`:''}
    <div class="rest" style="justify-content:center;margin-top:6px">Нажимайте на пару, которая выиграла очко</div>`;
}
function pcLiveTap(T,m,side){
  const ev=pcLivePoint(T,m,m.live,side);
  if(ev.includes('decided'))return render();
  buzz();touch(T);
  if(ev.includes('match')){m.live.decidedAt=Date.now();toast('Матч окончен — сохраните результат')}
  else if(ev.includes('set')){const s=m.live.sets[m.live.sets.length-1];toast(`Сет ${pcSetText(s)}${ev.includes('ends')?' · смена сторон':''}`)}
  else if(ev.includes('ends'))toast('Смена сторон');
  render();
}
function pcLiveSave(T,m){
  const L=m.live,c=pcMatchCheck(L.sets,T.cfg);if(c.err){toast(c.err);return}
  store.ui.live=null;ttSetResult(T,m,L.sets,c.win,null);buzz();touch(T);store.ui.tab='play';render();scrollTo(0,0);
  if(T.stage!=='results')toast(`Сохранено: ${c.wa}:${c.wb} по сетам`);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(!a.startsWith('pc-'))return;
  const d=store.pcdraft,T=cur(),M=T&&T.matches?T.matches.find(x=>x.id===+b.dataset.m):null;
  const redraw=()=>{saveLocal();render()};
  const LM=()=>T&&T.matches.find(x=>x.id===store.ui.live);
  switch(a){
    case 'pc-scheme':{const n=Math.floor(d.players.length/2);if(n<TT_MIN[b.dataset.v]){$('#e-cfg').textContent=`Для формата «${TT_SCHEME[b.dataset.v]}» нужно минимум ${TT_MIN[b.dataset.v]} пар`;return}d.scheme=b.dataset.v;return redraw()}
    case 'pc-cycles':{const P=ttPlan(d);d.cycles=Math.min(3,Math.max(1,(P.cycles||1)+ +b.dataset.d));buzz();return redraw()}
    case 'pc-groups':d.groupCount=+b.dataset.v;return redraw();
    case 'pc-adv':d.advance=+b.dataset.v;return redraw();
    case 'pc-third':d.third=!d.third;return redraw();
    case 'pc-cons':d.consolation=!d.consolation;return redraw();
    case 'pc-seed':d.seeding=b.dataset.v;return redraw();
    case 'pc-deuce':d.deuce=b.dataset.v;return redraw();
    case 'pc-fmt':d.fmt=b.dataset.v;return redraw();
    case 'pc-dec':d.dec=b.dataset.v;return redraw();
    case 'pc-tables':d.tables=Math.min(ttMaxTables(d),Math.max(1,ttTables(d)+ +b.dataset.d));buzz();return redraw();
    case 'pc-start':return pcStartFromDraft();
    case 'pc-open':store.pcdraft=store.pcdraft||freshPCDraft();return go('pcsetup',null);
    case 'pc-save':{const m=T.matches.find(x=>x.id===store.ui.score);if(m&&m.st!=='done')pcSaveScore(T,m);return}
    case 'pc-pick':{const m=LM();if(!m)return;const p=+b.dataset.v,L=m.live;
      if(L.pick==null){L.pick=p}else{const pa=ttSide(T,m,'a'),first=L.pick,second=p,part=x=>(pa.includes(x)?pa:ttSide(T,m,'b')).find(y=>y!==x);L.order=[first,second,part(first),part(second)]}
      touch(T);return render()}
    case 'pc-lot':{const m=LM();if(!m)return;const ps=ttSide(T,m,'a').concat(ttSide(T,m,'b'));m.live.pick=ps[Math.floor(Math.random()*4)];toast(`Жребий: подаёт ${T.players[m.live.pick]}`);touch(T);return render()}
    case 'pc-pt':{const m=LM();if(m&&m.st!=='done')pcLiveTap(T,m,b.dataset.v);return}
    case 'pc-undo':{const m=LM();if(!m)return;if(!pcLiveUndo(m.live)){if(!m.live.sets.length&&!m.live.g[0]&&!m.live.g[1]&&!m.live.p[0]&&!m.live.p[1]){m.live.order=null;m.live.pick=null}else toast('Нечего отменять')}touch(T);return render()}
    case 'pc-livesave':{const m=LM();if(m&&m.st!=='done')pcLiveSave(T,m);return}
  }
});

/* ================= sheet / toast ================= */
function sheet(title,text,actions,body){
  $('#sheet').innerHTML=`<div class="sheet-bg" ${body&&/<input|<textarea/.test(body)?'':'data-a="closesheet"'}><div class="sheet" role="dialog" aria-label="${esc(title)}">
    <div class="grab"></div><h3>${esc(title)}</h3>${text?`<p>${text}</p>`:''}${body||''}
    ${actions.map((a,i)=>`<button class="act ${a.kind||''}" data-sheet="${i}">${a.label}</button>`).join('')}
    <button class="act" data-a="closesheet" style="background:none;color:var(--mute)">Отмена</button></div></div>`;
  $('#sheet').querySelectorAll('[data-sheet]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const v=$('#sheet-input')?.value;closeSheet();actions[+b.dataset.sheet].run(v)}));
  $('.sheet').addEventListener('click',e=>{if(!e.target.closest('[data-a="closesheet"]'))e.stopPropagation()});
  const si=$('#sheet-input');if(si)si.focus();
}
function closeSheet(){$('#sheet').innerHTML=''}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}

/* ================= tournament flow ================= */
function finishMatch(T,k){
  const R=T.rounds[T.round],m=R.matches[k];
  if(m.done)return;
  const er=validScore(T,m.s1,m.s2);
  if(er){$('#err-'+k).textContent=er;return}
  clearTimeout(scoreSaveTimer);
  m.s1=+m.s1;m.s2=+m.s2;m.done=true;buzz();
  if(MEXF(T.format)){
    if(R.matches.every(x=>x.done)){
      if(T.rounds.length<T.cfg.total){T.rounds.push(mexicanoRound(T));T.round=T.rounds.length-1;touch(T);render();scrollTo({top:0,behavior:'smooth'});toast(`Раунд ${T.round+1} — пары по таблице`);return}
      T.stage='results';touch(T);render();scrollTo(0,0);return;
    }
  }else{
    const nx=T.rounds.findIndex(r=>r.matches.some(x=>!x.done));
    if(nx<0){T.stage='results';touch(T);render();scrollTo(0,0);return}
    if(nx!==T.round){T.round=nx;touch(T);render();scrollTo({top:0,behavior:'smooth'});toast(`Раунд ${T.round+1} — новые пары`);return}
  }
  touch(T);render();
  const nx=R.matches.findIndex(x=>!x.done);const el=$('#court-'+nx);el&&el.scrollIntoView({behavior:'smooth',block:'center'});
}
function reopenMatch(T,ri,k){
  const m=T.rounds[ri].matches[k];m.done=false;m.s1=String(m.s1);m.s2=String(m.s2);
  T.round=ri;T.stage='play';T.celebrated=false;touch(T);store.ui.tab='play';saveLocal();render();
  setTimeout(()=>{const el=$('#court-'+k);el&&el.scrollIntoView({behavior:'smooth',block:'center'})},50);
}
function copyResults(T){
  const txt=T.sport==='tt'||T.sport==='pc'?ttCopyText(T):(()=>{const {st}=standings(T);return `${T.name} (${FMT[T.format]}, ${dateRu(T.finishedAt||T.createdAt)})\n`+st.map(s=>`${s.place}. ${s.name} — Δ ${fmtD(s.d)} (${s.f}:${s.a}, игр ${s.g})`).join('\n')})();
  const manual=()=>{sheet('Итоги турнира','Выделите текст и скопируйте его.',[],`<textarea id="copy-area" readonly style="width:100%;height:220px;border-radius:14px;border:2px solid var(--mist);padding:10px;font:600 14px/1.4 var(--f-body);color:var(--ink);background:var(--paper)">${esc(txt)}</textarea>`);const ta=$('#copy-area');if(ta){ta.focus();ta.select()}};
  if(TG){
    try{TG.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(txt));return}catch(e){}
  }
  try{navigator.clipboard.writeText(txt).then(()=>toast('Итоги скопированы'),manual)}catch(err){manual()}
}
function deleteT(T){T.deleted=true;touch(T);go('home',null);toast('Турнир удалён')}
function renameSheet(T){
  sheet('Название турнира','',[{label:'Сохранить',kind:'primary',run:v=>{v=(v||'').trim();if(v){T.name=v.slice(0,60);touch(T);render()}}}],
    `<input class="textin" id="sheet-input" value="${esc(T.name)}" maxlength="60" aria-label="Название" style="margin-bottom:8px">`);
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,d=curDraft(),T=cur();
  switch(a){
    case 'home':return go('home',null);
    case 'new':return go('sport',null);
    case 'open':{const t=store.tournaments[b.dataset.id];return go(t.status==='finished'?'view':'play',t.id,'play')}
    case 'fmt':d.format=b.dataset.v;d.rounds=null;saveLocal();return render();
    case 'rm':d.players.splice(+b.dataset.i,1);d.sample=false;d.rounds=null;saveLocal();return render();
    case 'rmpair':d.players.splice(+b.dataset.i,2);d.sample=false;saveLocal();return render();
    case 'shufflepairs':d.players=shuffle(d.players);d.sample=false;buzz();saveLocal();return render();
    case 'clear':d.players=[];d.sample=false;saveLocal();render();return $('#newname').focus();
    case 'limit':d.limit=+b.dataset.v;saveLocal();return render();
    case 'lstep':d.limit=Math.min(99,Math.max(1,d.limit+ +b.dataset.d));buzz();saveLocal();return render();
    case 'mode':d.mode=b.dataset.v;saveLocal();return render();
    case 'scheme':d.scheme=b.dataset.v;saveLocal();return render();
    case 'cstep':d.courts=Math.min(maxCourts(d),Math.max(1,effCourts(d)+ +b.dataset.d));d.rounds=null;buzz();saveLocal();return render();
    case 'cystep':d.cycles=Math.min(4,Math.max(1,(d.cycles||1)+ +b.dataset.d));buzz();saveLocal();return render();
    case 'rstep':{const P=planFor(d);if(!P.ok)return;d.rounds=Math.min(Math.max(P.step,Math.floor(60/P.step)*P.step),Math.max(P.step,P.total+ +b.dataset.d*P.step));buzz();saveLocal();return render()}
    case 'start':return startTournament();
    case 'tab':store.ui.tab=b.dataset.v;saveLocal();render();return scrollTo(0,0);
    case 'sc':{const k=+b.dataset.m,s=b.dataset.s,m=T.rounds[T.round].matches[k];
      const c0=m['s'+s]===''?0:+m['s'+s];const v=Math.max(0,Math.min(T.cfg.limit,c0+ +b.dataset.d));
      buzz();return setScore(T,k,s,String(v),true);}
    case 'finish':return finishMatch(T,+b.dataset.m);
    case 'edit':{const m=T.rounds[T.round].matches[+b.dataset.m];
      if(MEXF(T.format)&&T.round<T.rounds.length-1)return toast('Следующий раунд уже составлен по этому счёту');
      m.done=false;m.s1=String(m.s1);m.s2=String(m.s2);touch(T);return render();}
    case 'gridedit':{const ri=+b.dataset.r,k=+b.dataset.m,m=T.rounds[ri].matches[k];
      if(MEXF(T.format)&&ri<T.rounds.length-1)return sheet('Нельзя исправить','В мексикано пары следующих раундов уже составлены по этому счёту. Исправить можно только матчи последнего раунда.',[]);
      return sheet('Исправить счёт?',`Матч ${m.s1}:${m.s2} снова станет открытым — введите верный счёт и нажмите «Закончить игру».`,[{label:'Исправить',kind:'primary',run:()=>reopenMatch(T,ri,k)}]);}
    case 'finishT':
      T.status='finished';T.finishedAt=Date.now();T.stage='results';touch(T);go('home',null);confetti();return toast('Турнир сохранён в завершённых');
    case 'menu':{
      const acts=[{label:'Переименовать',run:()=>renameSheet(T)}];
      if(T.stage==='play'&&T.round>0){
        if(MEXF(T.format)){
          if(!T.rounds[T.round].matches.some(m=>m.done))acts.push({label:'Вернуться к прошлому раунду',run:()=>sheet('Вернуться к раунду '+T.round+'?','Пары текущего раунда будут составлены заново после исправления.',[{label:'Вернуться',kind:'primary',run:()=>{T.rounds.pop();T.round=T.rounds.length-1;touch(T);store.ui.tab='play';render()}}])});
        }else acts.push({label:'Предыдущий раунд',run:()=>{T.round--;touch(T);store.ui.tab='play';render()}});
      }
      if(T.stage==='play')acts.push({label:'Остановить и подвести итоги',kind:'primary',run:()=>sheet('Остановить турнир?','Несыгранные матчи не войдут в зачёт, у игроков может оказаться разное число игр.',[{label:'Подвести итоги',kind:'primary',run:()=>{T.stage='results';touch(T);store.ui.tab='play';render();scrollTo(0,0)}}])});
      acts.push({label:'Удалить турнир',kind:'danger',run:()=>sheet('Удалить турнир?','Все результаты этого турнира будут удалены.',[{label:'Удалить',kind:'danger',run:()=>deleteT(T)}])});
      return sheet(T.name,`${FMT[T.format]} · ${T.stage==='results'?'все игры сыграны':`раунд ${T.round+1} из ${T.cfg.total}`}<br>${syncChip().replace('id="sync"','')}`,acts);}
    case 'amenu':return sheet(T.name,'Завершённый турнир',[
      {label:'Переименовать',run:()=>renameSheet(T)},
      {label:'Вернуть в активные',run:()=>{T.status='active';T.finishedAt=null;touch(T);go('play',T.id,'grid')}},
      {label:'Удалить турнир',kind:'danger',run:()=>sheet('Удалить турнир?','Результаты будут удалены без возможности восстановить.',[{label:'Удалить',kind:'danger',run:()=>deleteT(T)}])}]);
    case 'copy':return copyResults(T);
    case 'share':return shareResults(T);
    case 'closesheet':return closeSheet();
  }
});

/* ================= extras ================= */
let lock=null;
async function wake(){try{if('wakeLock' in navigator&&!lock){lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>lock=null)}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(store&&store.ui.screen==='play')wake();if(pend.size)flush()}});

function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=$('#confetti'),ctx=cv.getContext('2d'),dpr=devicePixelRatio||1;
  cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const cols=['#DFFF2F','#FFFFFF','#FFC93C','#FF5B4D','#7DF5C0'];
  const ps=[...Array(140)].map(()=>({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.25,vx:(Math.random()-.5)*13,vy:-Math.random()*13-4,s:Math.random()*7+4,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)],round:Math.random()<.3}));
  let t=0;(function f(){ctx.clearRect(0,0,innerWidth,innerHeight);
    ps.forEach(p=>{p.vy+=.32;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;
      if(p.round){ctx.beginPath();ctx.arc(0,0,p.s/2,0,7);ctx.fill()}else ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()});
    if(++t<200)requestAnimationFrame(f);else ctx.clearRect(0,0,innerWidth,innerHeight)})();
}

function start(data){
  store=(data&&data.store)||loadLocal()||freshStore();
  store.tournaments=store.tournaments||{};store.draft=store.draft||freshDraft();store.ttdraft=store.ttdraft||freshTTDraft();store.pcdraft=store.pcdraft||freshPCDraft();store.ui=store.ui||{screen:'home',id:null,tab:'play'};store.unsynced=store.unsynced||[];
  migrateOld();
  store.unsynced.forEach(id=>pend.add(id));
  if(TG)tgSetup();
  saveLocal();render();tgClosingGuard();connectCloud();
}
window.claude?.hot?.snapshot?.(()=>({store}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
